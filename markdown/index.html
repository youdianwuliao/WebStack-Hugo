<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器 - 生成 / 预览 / 导出</title>
<meta name="description" content="在线 Markdown 编辑器：左侧编写、右侧实时预览，支持标题、表格、代码块、任务列表、图片等完整语法，一键导出 HTML / Markdown 文件。全程浏览器本地处理。">
<meta property="og:title" content="Markdown 编辑器 - 生成 / 预览 / 导出">
<meta property="og:description" content="在线 Markdown 编辑器，实时预览，一键导出 HTML/Markdown。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.justgame.top/markdown/">
<meta property="og:site_name" content="星汉灿烂">
<meta name="theme-color" content="#818cf8">
<link rel="canonical" href="https://www.justgame.top/markdown/">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/images/icon-192.png">
<style>
:root{
  --bg1:#0b1020; --bg2:#141a33; --bg3:#0d1b2a;
  --card:rgba(255,255,255,.055);
  --card-border:rgba(255,255,255,.1);
  --card-hover:rgba(255,255,255,.09);
  --text:#e8ecf4; --muted:#9aa4c0; --faint:#6b7390;
  --accent:#818cf8; --accent2:#38bdf8; --gold:#fbbf24;
  --green:#34d399; --red:#f87171; --orange:#fb923c;
  --grad:linear-gradient(135deg,#818cf8,#38bdf8);
  --shadow:0 10px 40px rgba(0,0,0,.35);
  --chip-bg:rgba(255,255,255,.06);
  --chip-bg-active:linear-gradient(135deg,rgba(129,140,248,.2),rgba(56,189,248,.2));
  --code-bg:#0e1526;
}
.light{
  --bg1:#eef2fb; --bg2:#ffffff; --bg3:#e2e9f8;
  --card:#ffffff; --card-border:#e2e8f0; --card-hover:#f1f5ff;
  --text:#1e2a44; --muted:#5b6574; --faint:#8a93ab;
  --chip-bg:#eef2fb;
  --chip-bg-active:linear-gradient(135deg,#e0e7ff,#dbeafe);
  --shadow:0 10px 30px rgba(30,58,95,.08);
  --code-bg:#f6f8fa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed;
  color:var(--text); min-height:100vh; line-height:1.65;
  transition:background .3s,color .3s;
}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:42px;height:42px;border-radius:12px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(129,140,248,.35);flex-shrink:0;
}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:12px;color:var(--faint);margin-top:2px}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--card-border);
  background:var(--card);color:var(--muted);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.icon-btn:hover{background:var(--card-hover);color:var(--text)}
/* 工具栏 */
.toolbar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:10px 12px;border-radius:14px;border:1px solid var(--card-border);
  background:var(--card);margin-bottom:14px;position:sticky;top:12px;z-index:50;backdrop-filter:blur(8px);
}
.tb-btn{
  min-width:32px;height:32px;padding:0 9px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--chip-bg);color:var(--muted);cursor:pointer;font-size:13px;transition:.15s;
  display:flex;align-items:center;justify-content:center;font-weight:600;
}
.tb-btn:hover{color:var(--text);border-color:var(--accent);background:var(--card-hover)}
.tb-sep{width:1px;height:20px;background:var(--card-border);margin:0 4px}
.tb-select{
  height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--chip-bg);color:var(--text);font-size:13px;cursor:pointer;
}
.tb-select:focus{outline:none;border-color:var(--accent)}
.tb-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tb-btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.tb-btn.primary:hover{opacity:.88;color:#fff}
/* 编辑区 */
.editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:70vh}
@media(max-width:820px){.editor-wrap{grid-template-columns:1fr}}
.editor-col{display:flex;flex-direction:column;min-width:0}
.editor-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:12px;color:var(--faint)}
.editor-head .count{font-size:11px;color:var(--faint)}
#mdInput{
  flex:1;min-height:520px;resize:none;border-radius:14px;
  border:1px solid var(--card-border);background:var(--code-bg);color:var(--text);
  padding:16px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  line-height:1.7;transition:border-color .2s;
}
#mdInput:focus{outline:none;border-color:var(--accent)}
/* 预览 */
#mdPreview{
  flex:1;min-height:520px;overflow:auto;border-radius:14px;
  border:1px solid var(--card-border);background:var(--card);
  padding:22px 26px;font-size:14.5px;line-height:1.8;
}
#mdPreview::-webkit-scrollbar{width:8px}
#mdPreview::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:4px}
/* 预览内容样式 */
#mdPreview h1,#mdPreview h2,#mdPreview h3,#mdPreview h4{color:var(--text);margin:1.1em 0 .5em;line-height:1.35;font-weight:700}
#mdPreview h1{font-size:1.7em;border-bottom:2px solid var(--card-border);padding-bottom:.3em}
#mdPreview h2{font-size:1.4em;border-bottom:1px solid var(--card-border);padding-bottom:.25em}
#mdPreview h3{font-size:1.2em}
#mdPreview h4{font-size:1.05em}
#mdPreview p{margin:.6em 0}
#mdPreview a{color:var(--accent2)}
#mdPreview strong{font-weight:700}
#mdPreview em{font-style:italic}
#mdPreview del{text-decoration:line-through;color:var(--faint)}
#mdPreview ul,#mdPreview ol{margin:.6em 0;padding-left:1.6em}
#mdPreview li{margin:.25em 0}
#mdPreview ul{list-style:disc}
#mdPreview ul ul{list-style:circle}
#mdPreview ol{list-style:decimal}
#mdPreview blockquote{
  border-left:4px solid var(--accent);margin:.8em 0;padding:.3em 1em;
  background:var(--chip-bg);color:var(--muted);border-radius:0 8px 8px 0;
}
#mdPreview blockquote p{margin:.3em 0}
#mdPreview code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;
  background:var(--chip-bg);padding:2px 6px;border-radius:6px;
}
#mdPreview pre{
  background:var(--code-bg);border:1px solid var(--card-border);border-radius:12px;
  padding:14px 16px;overflow:auto;margin:.8em 0;line-height:1.55;
}
#mdPreview pre code{background:none;padding:0;font-size:13px;display:block}
#mdPreview table{
  border-collapse:collapse;margin:.8em 0;width:100%;font-size:13.5px;
  display:block;overflow-x:auto;
}
#mdPreview th,#mdPreview td{border:1px solid var(--card-border);padding:8px 12px;text-align:left}
#mdPreview th{background:var(--chip-bg);font-weight:600}
#mdPreview tr:nth-child(even){background:var(--chip-bg)}
#mdPreview hr{border:none;border-top:1px solid var(--card-border);margin:1.4em 0}
#mdPreview img{max-width:100%;border-radius:8px}
#mdPreview input[type=checkbox]{accent-color:var(--accent);margin-right:6px}
#mdPreview .task-list{list-style:none;padding-left:4px}
#mdPreview .task-list li{display:flex;align-items:flex-start;gap:6px}
#mdPreview .task-list input{margin-top:4px}
#mdPreview h1>a,#mdPreview h2>a,#mdPreview h3>a,#mdPreview h4>a{color:var(--text);text-decoration:none}
/* 隐藏额外信息 */
.empty-preview{color:var(--faint);text-align:center;padding:60px 10px;font-size:13px}
.toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:rgba(30,58,95,.92);color:#fff;padding:9px 20px;border-radius:999px;
  font-size:13px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.footer{text-align:center;font-size:11px;color:var(--faint);margin-top:24px}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">M↓</div>
      <div>
        <h1>Markdown 编辑器</h1>
        <div class="sub">生成 · 预览 · 修改 · 导出</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="window.open('../','_self')" title="返回导航">↩</button>
      <button class="icon-btn" onclick="toggleTheme()" title="切换主题">◐</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tb-btn" title="加粗" onclick="wrapText('**','**')"><b>B</b></button>
    <button class="tb-btn" title="斜体" onclick="wrapText('*','*')"><i>I</i></button>
    <button class="tb-btn" title="删除线" onclick="wrapText('~~','~~')"><s>S</s></button>
    <button class="tb-btn" title="行内代码" onclick="wrapText('`','`')">`</button>
    <button class="tb-btn" title="超链接" onclick="wrapText('[','](https://)')">🔗</button>
    <button class="tb-btn" title="图片" onclick="wrapText('![','](https://)')">🖼</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" title="H1" onclick="prependLine('# ')">H1</button>
    <button class="tb-btn" title="H2" onclick="prependLine('## ')">H2</button>
    <button class="tb-btn" title="H3" onclick="prependLine('### ')">H3</button>
    <button class="tb-btn" title="引用" onclick="prependLine('> ')">❝</button>
    <button class="tb-btn" title="无序列表" onclick="prependLine('- ')">•</button>
    <button class="tb-btn" title="有序列表" onclick="prependLine('1. ')">1.</button>
    <button class="tb-btn" title="任务列表" onclick="prependLine('- [ ] ')">☐</button>
    <button class="tb-btn" title="代码块" onclick="insertCodeBlock()">{ }</button>
    <button class="tb-btn" title="表格" onclick="insertTable()">▦</button>
    <button class="tb-btn" title="分隔线" onclick="prependLine('\n---\n')">—</button>
    <span class="tb-sep"></span>
    <select class="tb-select" id="mdLang" onchange="insertCodeBlock()">
      <option value="">代码语言…</option>
      <option>javascript</option><option>python</option><option>html</option>
      <option>css</option><option>json</option><option>bash</option>
      <option>sql</option><option>go</option><option>java</option>
      <option>typescript</option><option>yaml</option><option>plaintext</option>
    </select>
    <div class="tb-right">
      <button class="tb-btn" onclick="loadSample()" title="载入示例">示例</button>
      <button class="tb-btn" onclick="clearDoc()" title="清空">清空</button>
      <button class="tb-btn" onclick="exportMarkdown()" title="下载 .md 文件">下载 .md</button>
      <button class="tb-btn" onclick="exportHTML()" title="下载 .html 文件">下载 HTML</button>
      <button class="tb-btn" onclick="copyHTML()" title="复制渲染后的 HTML">复制 HTML</button>
      <button class="tb-btn primary" onclick="openPreview()" title="在新窗口查看预览">全屏预览</button>
    </div>
  </div>

  <div class="editor-wrap">
    <div class="editor-col">
      <div class="editor-head">
        <span>编辑区</span>
        <span class="count" id="mdCount">0 字符 · 0 行</span>
      </div>
      <textarea id="mdInput" spellcheck="false" placeholder="# 在这里输入 Markdown 内容&#10;&#10;左侧编辑，右侧实时预览…"></textarea>
    </div>
    <div class="editor-col">
      <div class="editor-head"><span>预览区</span></div>
      <div id="mdPreview"><div class="empty-preview">等待输入…</div></div>
    </div>
  </div>

  <div class="footer">
    <a href="https://www.justgame.top" target="_blank" rel="noopener">星汉灿烂</a> · Markdown 编辑器 · 基于 marked.js 开源库，内容仅在本地处理
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="marked.min.js"></script>
<script>
(function(){
  var THEME_KEY='mdToolTheme';
  function applyTheme(t){document.body.classList.toggle('light',t==='light')}
  function initTheme(){
    var s=localStorage.getItem(THEME_KEY);
    if(s!==null)applyTheme(s);
    else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)applyTheme('dark');
  }
  window.toggleTheme=function(){
    var isLight=document.body.classList.contains('light');
    applyTheme(isLight?'dark':'light');
    localStorage.setItem(THEME_KEY,isLight?'dark':'light');
  };
  initTheme();
})();
function $(id){return document.getElementById(id)}
function toast(msg){
  var t=$('toast');
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0'},2000);
}

/* marked 配置 */
marked.setOptions({
  gfm:true,
  breaks:true,
  tables:true,
  smartLists:true,
  highlight:function(code){return code}
});

/* 渲染 */
function render(){
  var src=$('mdInput').value;
  var preview=$('mdPreview');
  if(!src.trim()){
    preview.innerHTML='<div class="empty-preview">等待输入…</div>';
  }else{
    preview.innerHTML=marked.parse(src);
    postProcess(preview);
  }
  updateCount();
  localStorage.setItem('mdDraft',src);
}
function postProcess(container){
  container.querySelectorAll('a').forEach(function(a){
    a.target='_blank';a.rel='noopener';
  });
  // 任务列表样式
  container.querySelectorAll('li').forEach(function(li){
    if(li.textContent.trim().startsWith('[ ]')||li.textContent.trim().startsWith('[x]')){
      li.classList.add('task-list');
      if(!li.parentElement.classList.contains('task-list'))li.parentElement.classList.add('task-list');
    }
  });
  // 代码块头部添加复制按钮（简单的标签）
  container.querySelectorAll('pre').forEach(function(pre){
    if(pre.dataset.processed)return;
    pre.dataset.processed='1';
    pre.classList.add('code-block');
  });
}
function updateCount(){
  var t=$('mdInput').value;
  var chars=t.length;
  var lines=t.split('\n').length;
  $('mdCount').textContent=chars+' 字符 · '+lines+' 行';
}

/* 编辑工具 */
function getSel(){
  var ta=$('mdInput');
  return {s:ta.selectionStart,e:ta.selectionEnd};
}
function applyChange(fn){
  var ta=$('mdInput');
  var sel=getSel();
  var val=ta.value;
  var before=val.slice(0,sel.s);
  var selText=val.slice(sel.s,sel.e);
  var after=val.slice(sel.e);
  var res=fn(before,selText,after,sel.s,sel.e);
  ta.value=res.value;
  ta.focus();
  ta.setSelectionRange(res.s,res.e);
  render();
}
function wrapText(open,close){
  applyChange(function(before,sel,after){
    var text=sel||'选中文本';
    return {value:before+open+text+close+after,s:before.length+open.length,e:before.length+open.length+text.length};
  });
}
function prependLine(prefix){
  applyChange(function(before,sel,after){
    var lineStart=before.lastIndexOf('\n')+1;
    var text=before.slice(lineStart)+sel+after;
    // 找到当前行完整文本
    var full=before+sel+after;
    var ls=lineStart;
    var le=full.indexOf('\n',ls);
    if(le<0)le=full.length;
    var line=full.slice(ls,le);
    var newLine=prefix+line;
    var newValue=full.slice(0,ls)+newLine+full.slice(le);
    return {value:newValue,s:ls+prefix.length,e:ls+prefix.length+line.length};
  });
}
function insertCodeBlock(){
  var lang=$('mdLang').value;
  applyChange(function(before,sel,after){
    var fence='```'+(lang||'')+'\n';
    var text=sel||'在这里输入代码…';
    var nl='';
    var block='\n'+fence+text+'\n'+'```'+'\n';
    return {value:before+block+after,s:before.length+block.length,e:before.length+block.length};
  });
  $('mdLang').selectedIndex=0;
}
function insertTable(){
  var table='\n| 表头1 | 表头2 | 表头3 |\n| :--- | :---: | ---: |\n| 内容 | 内容 | 内容 |\n';
  applyChange(function(before,sel,after){
    return {value:before+table+after,s:before.length+table.length,e:before.length+table.length};
  });
}

/* 示例/清空 */
function loadSample(){
  $('mdInput').value=SAMPLE;
  render();
  toast('已载入示例文档');
}
function clearDoc(){
  $('mdInput').value='';
  render();
  toast('已清空');
}

/* 导出 */
function fullHTML(body){
  var isLight=document.body.classList.contains('light');
  var colors=isLight?
    {bg:'#f6f8fa',card:'#ffffff',text:'#1e2a44',muted:'#5b6574',code:'#f6f8fa',border:'#e2e8f0',accent:'#818cf8'}:
    {bg:'#0e1526',card:'#141a33',text:'#e8ecf4',muted:'#9aa4c0',code:'#0e1526',border:'#1a233a',accent:'#818cf8'};
  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Markdown 导出</title>\n'+
  '<style>\nbody{background:'+colors.bg+';color:'+colors.text+';font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;padding:2em;max-width:860px;margin:0 auto}\n'+
  'h1,h2,h3,h4{line-height:1.35;margin:1.1em 0 .5em}\nh1{font-size:1.7em;border-bottom:2px solid '+colors.border+';padding-bottom:.3em}\nh2{font-size:1.4em;border-bottom:1px solid '+colors.border+';padding-bottom:.25em}\n'+
  'a{color:'+colors.accent+'}\nblockquote{border-left:4px solid '+colors.accent+';margin:.8em 0;padding:.3em 1em;background:'+colors.code+';color:'+colors.muted+'}\n'+
  'pre{background:'+colors.code+';border:1px solid '+colors.border+';border-radius:10px;padding:14px 16px;overflow:auto}\ncode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}\npre code{background:none}\n'+
  'table{border-collapse:collapse;margin:.8em 0;width:100%}\nth,td{border:1px solid '+colors.border+';padding:8px 12px;text-align:left}\nth{background:'+colors.code+'}\nhr{border:none;border-top:1px solid '+colors.border+';margin:1.4em 0}\nimg{max-width:100%}\n'+
  '</style>\n</head>\n<body>\n'+body+'\n</body>\n</html>';
}
function getRenderedHTML(){
  var src=$('mdInput').value;
  if(!src.trim()){toast('内容为空');return null}
  return marked.parse(src);
}
function exportMarkdown(){
  var src=$('mdInput').value;
  if(!src.trim()){toast('内容为空');return}
  var blob=new Blob([src],{type:'text/markdown;charset=utf-8'});
  downloadBlob(blob,'document.md');
  toast('.md 已下载');
}
function exportHTML(){
  var body=getRenderedHTML();
  if(body===null)return;
  var blob=new Blob([fullHTML(body)],{type:'text/html;charset=utf-8'});
  downloadBlob(blob,'document.html');
  toast('HTML 已下载');
}
function copyHTML(){
  var body=getRenderedHTML();
  if(body===null)return;
  var html=fullHTML(body);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(html).then(function(){toast('HTML 已复制')}).catch(function(){prompt('手动复制：',html)});
  }else prompt('手动复制：',html);
}
function downloadBlob(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
function openPreview(){
  var body=getRenderedHTML();
  if(body===null)return;
  var w=window.open('','_blank');
  if(!w){toast('浏览器阻止了新窗口');return}
  w.document.write(fullHTML(body));
  w.document.close();
}

/* 自动保存草稿 */
(function(){
  var draft=localStorage.getItem('mdDraft');
  if(draft!==null&&draft.trim()){
    $('mdInput').value=draft;
    $('mdPreview').innerHTML='';
  }
})();

/* 事件 */
var debounceTimer=null;
$('mdInput').addEventListener('input',function(){
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(render,150);
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter')render();
