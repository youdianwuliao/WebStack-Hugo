<style>
:root{
  --bg1:#0b1020; --bg2:#141a33; --bg3:#0d1b2a;

  --green:#34d399; --red:#f87171; --orange:#fb923c;
  --grad:linear-gradient(135deg,#10b981,#34d399);
  --shadow:0 10px 40px rgba(0,0,0,.35);
  --chip-bg:rgba(255,255,255,.06);

.light{

  --card:#ffffff; --card-border:#e2e8f0; --card-hover:#f1f5ff;
  --text:#1e2a44; --muted:#5b6574; --faint:#8a93ab;

}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed;

.top-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--card-border);

}
.icon-btn:hover{background:var(--card-hover);color:var(--text)}

  flex:1;min-width:150px;padding:11px 8px;border-radius:12px;border:1px solid var(--card-border);
  background:var(--card);color:var(--muted);font-size:14px;cursor:pointer;transition:.2s;

<div class="wrap">

    <div class="card">

  <!-- 解析查看 -->

    <a href="https://www.justgame.top" target="_blank" rel="noopener">星汉灿烂</a> · 二维码工具 · 生成基于自研编码器，解析基于 jsQR 开源库
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 自研精简 QR 编码器（替换 qrcode-generator.js，支持版本 1-40、Byte/UTF-8、L/M/Q/H 容错、掩码优化）
var QREncoder = (function(){
  var RS_TABLE_RAW = null;
  var PP_TABLE = null;

  var EXP = new Array(512), LOG = new Array(256);
  (function(){
    var i, x=1;
    for(i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11d; }
    for(i=255;i<512;i++) EXP[i]=EXP[i-255];
  })();
  function gexp(n){ return EXP[n]; }
  function glog(n){ if(n<1) throw 'glog(0)'; return LOG[n]; }
  function gmul(a,b){ if(a===0||b===0) return 0; return EXP[LOG[a]+LOG[b]]; }

  // RS 块表解析
  function getRsBlocks(typeNumber, eccIndex){
    var list = RS_TABLE_RAW[(typeNumber-1)*4+eccIndex], out=[];
    for(var i=0;i<list.length;i+=3){
      for(var j=0;j<list[i];j++){
        out.push({totalCount:list[i+1], dataCount:list[i+2]});
      }
    }
    return out;
  }

  // 多项式
  function qrPolynomial(num, shift){
    var offset=0;
    while(offset<num.length && num[offset]===0) offset++;
    var _num=new Array(num.length-offset+shift);
    for(var i=0;i<num.length-offset;i++) _num[i]=num[i+offset];
    for(i=0;i<shift;i++) _num[num.length-offset+i]=0;
    return {
      _num:_num,
      getLength:function(){return _num.length},
      getAt:function(i){return _num[i]},
      multiply:function(e){
        var num=new Array(_num.length+e._num.length-1), i, j;
        for(i=0;i<num.length;i++) num[i]=0;
        for(i=0;i<_num.length;i++){
          for(j=0;j<e._num.length;j++){
            num[i+j] ^= gexp(glog(_num[i])+glog(e._num[j]));
          }
        }
        return qrPolynomial(num,0);
      },
      mod:function(e){
        if(_num.length - e._num.length < 0) return qrPolynomial(_num,0);
        var ratio=glog(_num[0])-glog(e._num[0]), num=_num.slice();
        for(var i=0;i<e._num.length;i++){
          num[i] ^= gexp(glog(e._num[i])+ratio);
        }
        return qrPolynomial(num,0).mod(e);
      }
    };
  }

  function getErrorCorrectPolynomial(len){
    var a=qrPolynomial([1],0);
    for(var i=0;i<len;i++) a=a.multiply(qrPolynomial([1,gexp(i)],0));
    return a;
  }

  function getBCHDigit(data){
    var digit=0;
    while(data!==0){ digit++; data>>>=1; }
    return digit;
  }
  var G15=(1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
  var G18=(1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
  var G15_MASK=(1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
  function getBCHTypeInfo(data){
    var d=data<<10;
    while(getBCHDigit(d)-getBCHDigit(G15)>=0) d ^= G15 << (getBCHDigit(d)-getBCHDigit(G15));
    return ((data<<10)|d) ^ G15_MASK;
  }
  function getBCHTypeNumber(data){
    var d=data<<12;
    while(getBCHDigit(d)-getBCHDigit(G18)>=0) d ^= G18 << (getBCHDigit(d)-getBCHDigit(G18));
    return (data<<12)|d;
  }

  function getLengthInBits(type){
    return (type<10)?8:(type<27)?16:16;
  }

  function getMaskFn(maskPattern){
    switch(maskPattern){
      case 0: return function(i,j){return (i+j)%2===0};
      case 1: return function(i,j){return i%2===0};
      case 2: return function(i,j){return j%3===0};
      case 3: return function(i,j){return (i+j)%3===0};
      case 4: return function(i,j){return (Math.floor(i/2)+Math.floor(j/3))%2===0};
      case 5: return function(i,j){return (i*j)%2+(i*j)%3===0};
      case 6: return function(i,j){return ((i*j)%2+(i*j)%3)%2===0};
      case 7: return function(i,j){return ((i*j)%3+(i+j)%2)%2===0};
      default: throw 'bad maskPattern';
    }
  }

  function getLostPoint(m){
    var n=m.length, lost=0, i,j,k;
    // level1
    for(var row=0;row<n;row++){
      for(var col=0;col<n;col++){
        var sameCount=0, dark=m[row][col];
        for(var r=-1;r<=1;r++){
          if(row+r<0||n<=row+r) continue;
          for(var c=-1;c<=1;c++){
            if(col+c<0||n<=col+c) continue;
            if(r===0&&c===0) continue;
            if(dark===m[row+r][col+c]) sameCount++;
          }
        }
        if(sameCount>5) lost+=3+sameCount-5;
      }
    }
    // level2
    for(row=0;row<n-1;row++){
      for(col=0;col<n-1;col++){
        var count=0;
        if(m[row][col]) count++;
        if(m[row+1][col]) count++;
        if(m[row][col+1]) count++;
        if(m[row+1][col+1]) count++;
        if(count===0||count===4) lost+=3;
      }
    }
    // level3
    for(row=0;row<n;row++){
      for(col=0;col<n-6;col++){
        if(m[row][col]&&!m[row][col+1]&&m[row][col+2]&&m[row][col+3]&&m[row][col+4]&&!m[row][col+5]&&m[row][col+6]){
          lost+=40;
        }
      }
    }
    for(col=0;col<n;col++){
      for(row=0;row<n-6;row++){
        if(m[row][col]&&!m[row+1][col]&&m[row+2][col]&&m[row+3][col]&&m[row+4][col]&&!m[row+5][col]&&m[row+6][col]){
          lost+=40;
        }
      }
    }
    // level4
    var darkCount=0;
    for(row=0;row<n;row++) for(col=0;col<n;col++) if(m[row][col]) darkCount++;
    var ratio=Math.abs(100*darkCount/n/n-50)/5;
    lost+=ratio*10;
    return lost;
  }

  function createBytes(buffer, rsBlocks){
    var offset=0, maxDc=0, maxEc=0, dcdata=[], ecdata=[];
    for(var r=0;r<rsBlocks.length;r++){
      var dcCount=rsBlocks[r].dataCount, ecCount=rsBlocks[r].totalCount-dcCount;
      maxDc=Math.max(maxDc,dcCount); maxEc=Math.max(maxEc,ecCount);
      dcdata[r]=new Array(dcCount);
      for(var i=0;i<dcdata[r].length;i++) dcdata[r][i]=0xff & buffer[i+offset];
      offset+=dcCount;
      var rsPoly=getErrorCorrectPolynomial(ecCount);
      var rawPoly=qrPolynomial(dcdata[r], rsPoly.getLength()-1);
      var modPoly=rawPoly.mod(rsPoly);
      ecdata[r]=new Array(rsPoly.getLength()-1);
      for(i=0;i<ecdata[r].length;i++){
        var modIndex=i+modPoly.getLength()-ecdata[r].length;
        ecdata[r][i]=(modIndex>=0)?modPoly.getAt(modIndex):0;
      }
    }
    var totalCodeCount=0;
    for(r=0;r<rsBlocks.length;r++) totalCodeCount+=rsBlocks[r].totalCount;
    var data=new Array(totalCodeCount), index=0;
    for(i=0;i<maxDc;i++) for(r=0;r<rsBlocks.length;r++) if(i<dcdata[r].length){ data[index]=dcdata[r][i]; index++; }
    for(i=0;i<maxEc;i++) for(r=0;r<rsBlocks.length;r++) if(i<ecdata[r].length){ data[index]=ecdata[r][i]; index++; }
    return data;
  }

  function createData(typeNumber, eccIndex, dataBytes){
    var rsBlocks=getRsBlocks(typeNumber,eccIndex);
    var buffer=[];
    // mode indicator: 0100 (Byte)
    buffer=appendBits(buffer, 4, 4);
    // char count
    buffer=appendBits(buffer, dataBytes.length, getLengthInBits(typeNumber));
    // data
    for(var i=0;i<dataBytes.length;i++) buffer=appendBits(buffer, dataBytes[i], 8);
    // terminator
    var capacity=0;
    for(i=0;i<rsBlocks.length;i++) capacity+=(rsBlocks[i].totalCount-rsBlocks[i].dataCount); // 错误，应为数据容量
    capacity=0;
    for(i=0;i<rsBlocks.length;i++) capacity+=rsBlocks[i].dataCount;
    capacity*=8;
    var maxBits=capacity-4-getLengthInBits(typeNumber);
    // 终止位最多4位
    var dataBits=buffer.length;
    var termBits=Math.min(4, maxBits-dataBits);
    for(i=0;i<termBits;i++) buffer.push(0);
    // 补齐到8位
    while(buffer.length%8!==0) buffer.push(0);
    // 填充字节
    var padBytes=[0xec,0x11], p=0;
    while(buffer.length<capacity){ for(i=0;i<8;i++) buffer.push((padBytes[p]>>(7-i))&1); p^=1; }
    // 转为字节
    var byteData=[];
    for(i=0;i<buffer.length;i+=8){
      var b=0;
      for(var j=0;j<8;j++) b=(b<<1)|buffer[i+j];
      byteData.push(b);
    }
    return createBytes(byteData, rsBlocks);
  }
  function appendBits(buffer, value, length){
    for(var i=length-1;i>=0;i--) buffer.push((value>>i)&1);
    return buffer;
  }

  function encode(text, ecc, forceMask){
    var eccIndexMap={L:0,M:1,Q:2,H:3};
    var eccValMap={L:1,M:0,Q:3,H:2};
    var eccIndex=eccIndexMap[ecc];
    var eccVal=eccValMap[ecc];
    if(eccIndex===undefined) throw 'bad ecc';

    // UTF-8 编码
    var bytes=[];
    for(var i=0;i<text.length;i++){
      var c=text.charCodeAt(i);
      if(c<0x80){ bytes.push(c); }
      else if(c<0x800){ bytes.push(0xc0|(c>>6), 0x80|(c&0x3f)); }
      else if(c>=0xd800&&c<=0xdbff&&i+1<text.length){
        var c2=text.charCodeAt(i+1);
        if(c2>=0xdc00&&c2<=0xdfff){
          var cp=0x10000+((c-0xd800)<<10)+(c2-0xdc00);
          bytes.push(0xf0|(cp>>18),0x80|((cp>>12)&0x3f),0x80|((cp>>6)&0x3f),0x80|(cp&0x3f));
          i++;
          continue;
        }
        bytes.push(0xef,0xbf,0xbd);
      }else{
        bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));
      }
    }
    // 选择版本
    var typeNumber=0;
    for(var t=1;t<=40;t++){
      var blocks=getRsBlocks(t,eccIndex), dataCap=0;
      for(var b=0;b<blocks.length;b++) dataCap+=blocks[b].dataCount;
      dataCap*=8;
      var overhead=4+getLengthInBits(t);
      if(bytes.length*8+overhead<=dataCap){ typeNumber=t; break; }
    }
    if(typeNumber===0) throw 'too long';
    var data=createData(typeNumber,eccIndex,bytes);

    // 构建矩阵
    var count=typeNumber*4+17;
    var modules=[];
    for(var row=0;row<count;row++){ modules[row]=new Array(count); for(var col=0;col<count;col++) modules[row][col]=null; }

    function setupProbe(row,col){
      for(var r=-1;r<=7;r++){
        if(row+r<0||count<=row+r) continue;
        for(var c=-1;c<=7;c++){
          if(col+c<0||count<=col+c) continue;
          modules[row+r][col+c]=(0<=r&&r<=6&&(c===0||c===6))||(0<=c&&c<=6&&(r===0||r===6))||(2<=r&&r<=4&&2<=c&&c<=4);
        }
      }
    }
    setupProbe(0,0); setupProbe(count-7,0); setupProbe(0,count-7);
    // alignment
    var pos=PP_TABLE[typeNumber-1];
    for(var i=0;i<pos.length;i++){
      for(var j=0;j<pos.length;j++){
        var r=pos[i],c=pos[j];
        if(modules[r][c]===null){
          for(var rr=-2;rr<=2;rr++){
            for(var cc=-2;cc<=2;cc++){
              modules[r+rr][c+cc]= (rr===-2||rr===2||cc===-2||cc===2||(rr===0&&cc===0));
            }
          }
        }
      }
    }
    // timing
    for(i=8;i<count-8;i++){
      if(modules[i][6]===null) modules[i][6]=i%2===0;
      if(modules[6][i]===null) modules[6][i]=i%2===0;
    }
    // format info
    function setupTypeInfo(maskPattern, test){
      var dataBits=(eccVal<<3)|maskPattern;
      var bits=getBCHTypeInfo(dataBits);
      for(i=0;i<15;i++){
        var mod=(!test && (((bits>>i)&1)===1));
        if(i<6) modules[i][8]=mod;
        else if(i<8) modules[i+1][8]=mod;
        else modules[count-15+i][8]=mod;
      }
      for(i=0;i<15;i++){
        mod=(!test && (((bits>>i)&1)===1));
        if(i<8) modules[8][count-i-1]=mod;
        else if(i<9) modules[8][15-i-1+1]=mod;
        else modules[8][15-i-1]=mod;
      }
      modules[count-8][8]=!test;
    }
    // version info
    function setupTypeNumber(test){
      var bits=getBCHTypeNumber(typeNumber);
      for(i=0;i<18;i++){
        var mod=(!test && (((bits>>i)&1)===1));
        modules[Math.floor(i/3)][i%3+count-8-3]=mod;
      }
      for(i=0;i<18;i++){
        mod=(!test && (((bits>>i)&1)===1));
        modules[i%3+count-8-3][Math.floor(i/3)]=mod;
      }
    }
    if(typeNumber>=7) setupTypeNumber(true);
    // mask selection
    var bestMask=(forceMask!==undefined)?forceMask:0, bestLost=Infinity;
    if(forceMask===undefined){
      for(var mask=0;mask<8;mask++){
        setupTypeInfo(mask,true);
        if(typeNumber>=7) setupTypeNumber(true);
        var copy=[];
        for(row=0;row<count;row++){ copy[row]=modules[row].slice(); }
        mapData(data, mask, copy, count);
        var lost=getLostPoint(copy);
        if(lost<bestLost){ bestLost=lost; bestMask=mask; }
      }
    }
    // final
    setupTypeInfo(bestMask,false);
    if(typeNumber>=7) setupTypeNumber(false);
    mapData(data, bestMask, modules, count);
    for(row=0;row<count;row++) for(col=0;col<count;col++) if(modules[row][col]===null) modules[row][col]=false;
    return {count:count, modules:modules};
  }

  function mapData(data, maskPattern, modules, count){
    var inc=-1, row=count-1, bitIndex=7, byteIndex=0;
    var maskFn=getMaskFn(maskPattern);
    for(var col=count-1; col>0; col-=2){
      if(col===6) col-=1;
      while(true){
        for(var c=0;c<2;c++){
          if(modules[row][col-c]===null){
            var dark=false;
            if(byteIndex<data.length) dark=(((data[byteIndex]>>>bitIndex)&1)===1);
            var mask=maskFn(row,col-c);
            if(mask) dark=!dark;
            modules[row][col-c]=dark;
            bitIndex-=1;
            if(bitIndex===-1){ byteIndex+=1; bitIndex=7; }
          }
        }
        row+=inc;
        if(row<0||count<=row){ row-=inc; inc=-inc; break; }
      }
    }
  }

  return { init: function(rs, pp){ RS_TABLE_RAW = rs; PP_TABLE = pp; }, encode: encode };
})();

  var _text = '';

  obj.addData = function(data, mode) { _text = String(data); };
  obj.make = function() {

  };

/* ---------- 生成 ---------- */
var currentQRData=null, currentSVG=null;
var PRESETS={
  text:{name:'文本',build:function(v){return v}},
  url:{name:'网址',build:function(v){if(!/^https?:\/\//i.test(v))return 'https://'+v;return v}},
  tel:{name:'电话',build:function(v){return 'tel:'+v}},
  sms:{name:'短信',build:function(v){return 'SMSTO:'+v}},
  email:{name:'邮件',build:function(v){return 'mailto:'+v}},
  wifi:{name:'Wi-Fi',build:function(v){return 'WIFI:T:WPA;S:'+v.split(':')[0]+';P:'+(v.split(':')[1]||'')+';;'}},
  vc:{name:'名片',build:function(v){return 'BEGIN:VCARD\nVERSION:3.0\nFN:'+v+'\nEND:VCARD'}}
};
function presetType(){
  var t=$('qrType').value;
  var cur=$('qrText').value;
  // 切换时若有内置前缀则剥离
  if(t==='tel'&&cur.startsWith('tel:'))$('qrText').value=cur.slice(4);
  else if(t==='email'&&cur.startsWith('mailto:'))$('qrText').value=cur.slice(7);
  else if(t==='sms'&&cur.startsWith('SMSTO:'))$('qrText').value=cur.slice(6);
  else if(t==='url'&&cur.startsWith('https://'))$('qrText').value=cur.slice(8);
}
function loadPreset(){
  quickPreset('url','https://www.justgame.top/');
}
function quickPreset(type,value){
  $('qrType').value=type;
  $('qrText').value=value;
  generateQR();
}
function buildPayload(){
  var type=$('qrType').value;
  var v=$('qrText').value.trim();
  if(!v){toast('请输入内容');return null}
  return PRESETS[type]?PRESETS[type].build(v):v;
}
function updatePreview(){
  currentQRData=null;
  $('qrCanvasWrap').innerHTML='<div class="empty-preview">输入内容后自动生成二维码</div>';
  $('previewActions').style.display='none';
}
function generateQR(){
  var payload=buildPayload();
  if(payload===null)return;
  var size=+$('qrSize').value;
  var ecc=$('qrEcc').value;
  var margin=+$('qrMargin').value;
  var fg=$('qrFg').value;
  var bg=$('qrBg').value;
  var typeNumber=0;
  try{
    var qr=qrcode(typeNumber,ecc);
    qr.addData(payload,'Byte');
    qr.make();
    currentQRData={qr:qr,margin:margin,fg:fg,bg:bg,size:size};
    renderQR();
    toast('二维码已生成');
  }catch(e){
    $('qrCanvasWrap').innerHTML='<div class="empty-preview" style="color:var(--red)">生成失败：'+escapeHtml(e.message)+'<br><span style="font-size:11px">内容过长请缩短，或提高容错级别</span></div>';
  }
}
function renderQR(){
  if(!currentQRData)return;
  var q=currentQRData.qr,margin=currentQRData.margin,fg=currentQRData.fg,bg=currentQRData.bg,size=currentQRData.size;
  var count=q.getModuleCount();
  var canvas=document.createElement('canvas');
  canvas.width=canvas.height=size;
  var ctx=canvas.getContext('2d');
  var ms=Math.floor(size/count);
  var offset=Math.floor((size-count*ms)/2);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,size,size);
  // 留白
  var cell=ms;
  ctx.fillStyle=fg;
  for(var r=0;r<count;r++){
    for(var c=0;c<count;c++){
      if(q.isDark(r,c)){
        ctx.fillRect(offset+c*cell,offset+r*cell,cell,cell);
      }
    }
  }
  // Logo
  if($('qrLogo').checked){
    var logoSize=Math.floor(size*0.22);
    var lx=Math.floor((size-logoSize)/2),ly=lx;
    ctx.fillStyle=bg;
    ctx.fillRect(lx-3,ly-3,logoSize+6,logoSize+6);
    ctx.fillStyle=$('qrLogoColor').value;
    ctx.fillRect(lx,ly,logoSize,logoSize);
    // 绘制简单图标（三横，象征二维码/站点）
    ctx.fillStyle='#fff';
    var w=Math.floor(logoSize*0.6),h=Math.floor(logoSize*0.6);
    var ox=lx+Math.floor((logoSize-w)/2),oy=ly+Math.floor((logoSize-h)/2);
    ctx.fillRect(ox,oy+Math.floor(h*0.12),w,Math.floor(h*0.2));
    ctx.fillRect(ox,oy+Math.floor(h*0.42),w,Math.floor(h*0.2));
    ctx.fillRect(ox,oy+Math.floor(h*0.72),w,Math.floor(h*0.2));
  }
  var wrap=$('qrCanvasWrap');
  wrap.innerHTML='';
  wrap.appendChild(canvas);
  $('previewActions').style.display='';
  // 同步生成 SVG
  currentSVG=buildSVG(count,margin,fg,bg,size);
}
function buildSVG(count,margin,fg,bg,size){
  var q=currentQRData.qr;
  var cells=[];
  for(var r=0;r<count;r++){
    for(var c=0;c<count;c++){
      if(q.isDark(r,c))cells.push(r+' '+c);
    }
  }
  var total=size;
  var cell=total/count;
  var off=(size-count*Math.floor(size/count))/2;
  var rects=cells.map(function(p){
    var xy=p.split(' ');
    return '<rect x="'+(off+xy[1]*cell).toFixed(2)+'" y="'+(off+xy[0]*cell).toFixed(2)+'" width="'+Math.ceil(cell).toFixed(2)+'" height="'+Math.ceil(cell).toFixed(2)+'"/>';
  }).join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'"><rect width="100%" height="100%" fill="'+bg+'"/>'+rects+'</svg>';
}
function downloadQR(fmt){
  if(!currentQRData){toast('请先生成二维码');return}
  var size=currentQRData.size;
  var name='qrcode-'+Date.now()+'.'+fmt;
  if(fmt==='svg'){
    var blob=new Blob([currentSVG],{type:'image/svg+xml;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    toast('SVG 已下载');
    return;
  }
  var canvas=$('qrCanvasWrap').querySelector('canvas');
  if(!canvas){toast('请先生成二维码');return}
  var a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove()},500);
  toast('PNG 已下载');
}
function copyQR(){
  var canvas=$('qrCanvasWrap').querySelector('canvas');
  if(!canvas){toast('请先生成二维码');return}
  canvas.toBlob(function(blob){
    if(navigator.clipboard&&navigator.clipboard.write){
      var item=new ClipboardItem({'image/png':blob});
      navigator.clipboard.write([item]).then(function(){toast('图片已复制到剪贴板')}).catch(function(){toast('复制失败，请用下载按钮')});
    }else toast('当前浏览器不支持复制图片，请使用下载');
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}

/* 自动预览 */
var debounceTimer=null;
$('qrText').addEventListener('input',function(){
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(function(){
    if($('qrText').value.trim())generateQR();
  },400);

$('qrSize').addEventListener('input',function(){if(currentQRData)generateQR()});
$('qrEcc').addEventListener('change',function(){if($('qrText').value.trim())generateQR()});
$('qrMargin').addEventListener('change',function(){if($('qrText').value.trim())generateQR()});
$('qrFg').addEventListener('input',function(){if($('qrText').value.trim())generateQR()});
$('qrBg').addEventListener('input',function(){if($('qrText').value.trim())generateQR()});
$('qrLogo').addEventListener('change',function(){if($('qrText').value.trim())generateQR()});
$('qrLogoColor').addEventListener('input',function(){if($('qrText').value.trim())generateQR()});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('panel-gen').classList.contains('active'))generateQR();
});

/* ---------- 解析查看 ---------- */
var scanCanvas=null;
function scanImageFromCanvas(canvas){
  var w=canvas.width||canvas.naturalWidth||0,h=canvas.height||canvas.naturalHeight||0;
  if(!w||!h)return null;
  var maxDim=1200;
  var scale=1;
  if(Math.max(w,h)>maxDim)scale=maxDim/Math.max(w,h);
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale);c.height=Math.round(h*scale);
  var ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(canvas,0,0,c.width,c.height);
  scanCanvas=c;
  try{
    var imgData=ctx.getImageData(0,0,c.width,c.height);
    var code=jsQR(imgData.data,c.width,c.height);
    return code;
  }catch(e){return null}
}
function showScanStatus(ok,html){
  var s=$('scanStatus');
  s.className='status '+(ok?'ok':'err');
  s.innerHTML=html;
  s.style.display='';
}
function processImageFile(file){
  if(!file)return;
  if(!/^image\//.test(file.type)){
    showScanStatus(false,'<b>错误：</b>请选择图片文件');
    return;
  }
  var reader=new FileReader();
  reader.onload=function(e){
    var src=e.target.result;
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      canvas.width=img.naturalWidth||img.width;
      canvas.height=img.naturalHeight||img.height;
      var ctx=canvas.getContext('2d');
      var preview=null;
      try{
        ctx.drawImage(img,0,0);
        preview=canvas.toDataURL('image/png');
      }catch(err){}
      var code=scanImageFromCanvas(canvas);
      if(code&&code.data){
        showScanStatus(true,'<b>✓ 识别成功</b>，共 <b>'+code.binaryData.length+'</b> 个模块');
        renderScanResult(code.data,preview);
      }else{
        showScanStatus(false,'<b>✗ 未识别到二维码</b>，请尝试：旋转图片、放大二维码区域、提高清晰度');
        renderScanResult(null,preview);
      }
    };
    img.onerror=function(){
      showScanStatus(false,'<b>错误：</b>图片加载失败');
    };
    img.src=src;
  };
  reader.onerror=function(){
    showScanStatus(false,'<b>错误：</b>读取文件失败');
  };
  reader.readAsDataURL(file);
}
function renderScanResult(content,preview){
  var box=$('scanResult');
  var html='';
  if(preview){
    html+='<img class="scan-img" src="'+preview+'" alt="扫描图片" style="max-width:180px">';
  }
  if(content!==null){
    html+='<div class="scan-content">'+escapeHtml(content)+'</div>';
    html+='<div class="scan-meta">'+
      '<div class="stat"><div class="v">'+(content.length>1024?formatKB(content.length):content.length)+'</div><div class="n">字符数</div></div>'+
      '<div class="stat"><div class="v">'+detectType(content)+'</div><div class="n">内容类型</div></div>'+
      '</div>';
    html+='<div class="btn-group" style="margin-top:12px">';
    if(/^https?:\/\//i.test(content)){
      html+='<a class="btn primary" href="'+escapeHtml(content)+'" target="_blank" rel="noopener">打开链接</a>';
    }
    html+='<button class="btn" onclick="copyScan(\''+escapeHtml(content).replace(/'/g,'&#39;')+'\')">复制内容</button>';
    if(/^WIFI:/i.test(content)){
      var m=content.match(/S:([^;]*);/);
      if(m)html+='<button class="btn" onclick="connectWifi(\''+escapeHtml(m[1])+'\')">连接 Wi-Fi</button>';
    }
    html+='</div>';
  }else{
    html+='<div class="empty-hint" style="padding:20px;color:var(--faint);text-align:center">暂未识别到二维码内容</div>';
  }
  box.innerHTML=html;
}
function formatKB(n){
  if(n>=1000)return (n/1000).toFixed(1)+'K';
  return String(n);
}
function detectType(c){
  if(/^https?:\/\//i.test(c))return '链接';
  if(/^WIFI:/i.test(c))return 'Wi-Fi';
  if(/^BEGIN:VCARD/i.test(c))return '名片';
  if(/^mailto:/i.test(c))return '邮件';
  if(/^tel:/i.test(c))return '电话';
  return '文本';
}
window.copyScan=function(c){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(c).then(function(){toast('已复制')}).catch(function(){prompt('手动复制：',c)});
  }else prompt('手动复制：',c);
};
window.connectWifi=function(ssid){
  toast('请在系统 Wi-Fi 设置中手动连接：'+ssid);
};

/* 上传/拖拽 */
$('scanFile').addEventListener('change',function(){
  if(this.files[0])processImageFile(this.files[0]);
  this.value='';
});
var scanDrop=$('scanDrop');
scanDrop.addEventListener('dragover',function(e){e.preventDefault();scanDrop.classList.add('over')});
scanDrop.addEventListener('dragleave',function(){scanDrop.classList.remove('over')});
scanDrop.addEventListener('drop',function(e){
  e.preventDefault();scanDrop.classList.remove('over');
  var f=e.dataTransfer.files[0];
  if(f)processImageFile(f);
});
window.pasteScan=function(){
  if(!navigator.clipboard||!navigator.clipboard.read){
    showScanStatus(false,'<b>提示：</b>当前浏览器不支持剪贴板读取，请改用上传图片');
    return;
  }
  navigator.clipboard.read().then(function(items){
    for(var i=0;i<items.length;i++){
      var it=items[i];
      if(it.types.indexOf('image/png')>=0||it.types.indexOf('image/jpeg')>=0){
        it.getType(it.types[0]).then(function(blob){
          processImageFile(blob);
        });
        return;
      }
    }
    showScanStatus(false,'<b>提示：</b>剪贴板中没有图片');
  }).catch(function(){
    showScanStatus(false,'<b>提示：</b>读取剪贴板失败（可能需要 HTTPS 或授权），请改用上传图片');
  });
};
window.clearScan=function(){
  $('scanResult').innerHTML='';
  $('scanStatus').style.display='none';
  toast('已清空');
};
