<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星海导航 - Game Style</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="scanlines"></div>

    <header>
        <div class="logo">
            <span class="logo-icon"><i class="fas fa-rocket"></i></span>
            <span class="logo-text">星<span class="highlight">海</span>导航</span>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索导航..." autocomplete="off">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <nav class="category-nav">
        <div class="nav-scroll">
            <button class="category-btn active" data-category="all">
                <i class="fas fa-globe"></i>
                <span>全部</span>
            </button>
            <button class="category-btn" data-category="常用推荐">
                <i class="far fa-star"></i>
                <span>常用推荐</span>
            </button>
            <button class="category-btn" data-category="ai未来">
                <i class="fas fa-robot"></i>
                <span>AI未来</span>
            </button>
            <button class="category-btn" data-category="科研办公">
                <i class="fas fa-flask"></i>
                <span>科研办公</span>
            </button>
            <button class="category-btn" data-category="丫丫喜欢玩游戏">
                <i class="fas fa-gamepad"></i>
                <span>游戏天地</span>
            </button>
            <button class="category-btn" data-category="开发设计">
                <i class="fas fa-tools"></i>
                <span>开发设计</span>
            </button>
            <button class="category-btn" data-category="影音视频">
                <i class="fas fa-play-circle"></i>
                <span>影音视频</span>
            </button>
            <button class="category-btn" data-category="网盘资源">
                <i class="far fa-folder-open"></i>
                <span>网盘资源</span>
            </button>
        </div>
    </nav>

    <main>
        <div class="sites-grid" id="sites-container"></div>
    </main>

    <footer>
        <p>Made with <i class="fas fa-heart"></i> | 星海导航 v2.0</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
