<p>方天四季静静守护，方天四季，日月乾坤，看红尘滚滚，云舒云卷，这一切爱的显化是我们坚守的三生三世的诺言，曾经彼此纯洁的告白是这一生的眷恋的情爱，我们奋不顾身来到此生，缘起缘落，尤叹彼此擦肩，奔波劳碌的追逐我们的梦想，有时却忘记了爱就在你身边，从未走远，那份誓言是你眼里的和光如尘，那份爱恋是岁月的購，我们约定在繁花绽开的季节一起长眠，芬芳千瓣是我们爱的永恒的缠绵，四季不休，爱无眠</p>
