    <h1>幻梦雷霆弯弓满</h1>
    <div class="meta">不在三界中 · 者也</div>
    <div class="article-body">
<p>幻梦雷霆弯弓满，独步轩辕猎游龙。花仙神月无常刃，离殇断剑斩惊鸿。孤独，是落叶间四季的馈赠，向着光的方向，追随爱的节奏，每一次忐忑的心动，都是靠近你时那含羞笑靥的绯红，每一次离别，都是下次相逢的旁白</p>
<p class="verse">拂袖尘霞清风岗，<br>弹指祥云若惊鸿。<br>斜阳落日光似水，<br>星烛满目照空城。</p>
