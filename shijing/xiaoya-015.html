    <div class="article-body">
<p>彤弓弨兮，受言藏之。我有嘉宾，中心贶之。钟鼓既设，一朝飨之。</p><p>彤弓弨兮，受言载之。我有嘉宾，中心喜之。钟鼓既设，一朝右之。</p><p>彤弓弨兮，受言櫜之。我有嘉宾，中心好之。钟鼓既设，一朝酬之。</p>
