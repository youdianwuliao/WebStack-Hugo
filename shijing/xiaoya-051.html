    <h1>甫田</h1>
    <div class="meta">第51篇 · 小雅 · 甫田之什 · 集思阁</div>
    <div class="article-body">
<p>倬彼甫田，岁取十千。我取其陈，食我农人。自古有年。</p><p>今适南亩，或耘或耔。黍稷薿薿，攸介攸止，烝我髦士。</p><p>以我齐明，与我牺羊，以社以方。我田既臧，农夫之庆。</p><p>琴瑟击鼓，以御田祖。以祈甘雨，以介我稷黍，以穀我士女。</p><p>曾孙来止，以其妇子。馌彼南亩，田畯至喜。攘其左右，</p><p>尝其旨否。禾易长亩，终善且有。曾孙不怒，农夫克敏。</p><p>曾孙之稼，如茨如梁。曾孙之庾，如坻如京。乃求千斯仓，</p><p>乃求万斯箱。黍稷稻粱，农夫之庆。报以介福，万寿无疆。</p>
