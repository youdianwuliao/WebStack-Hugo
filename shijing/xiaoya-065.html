    <h1>都人士</h1>
    <div class="meta">第65篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>彼都人士，狐裘黄黄。其容不改，出言有章。行归于周，万民所望。</p><p>彼都人士，台笠缁撮。彼君子女，绸直如发。我不见兮，我心不说。</p><p>彼都人士，充耳琇实。彼君子女，谓之尹吉。我不见兮，我心苑结。</p><p>彼都人士，垂带而厉。彼君子女，卷发如虿。我不见兮，言从之迈。</p><p>匪伊垂之，带则有余。匪伊卷之，发则有旟。我不见兮，云何盱矣。</p>
