    <div class="article-body">
<p>猗嗟昌兮，颀而长兮。抑若扬兮，美目扬兮。巧趋跄兮，射则臧兮。</p><p>猗嗟名兮，美目清兮。仪既成兮，终日射侯，不出正兮，展我甥兮。</p><p>猗嗟娈兮，清扬婉兮。舞则选兮，射则贯兮，四矢反兮，以御乱兮。</p>
