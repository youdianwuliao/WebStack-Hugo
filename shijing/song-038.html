    <h1>玄鸟</h1>
    <div class="meta">第38篇 · 商颂 · 那之什 · 集思阁</div>
    <div class="article-body">
<p>天命玄鸟，降而生商，宅殷土芒芒。古帝命武汤，正域彼四方。</p><p>方命厥后，奄有九有。商之先后，受命不殆，在武丁孙子。武丁孙子，武王靡不胜。</p><p>龙旂十乘，大糦是承。邦畿千里，维民所止，肇域彼四海。</p><p>四海来假，来假祁祁。景员维河。殷受命咸宜，百禄是何。</p>
