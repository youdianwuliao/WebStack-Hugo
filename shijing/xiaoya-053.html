    <h1>瞻彼洛矣</h1>
    <div class="meta">第53篇 · 小雅 · 甫田之什 · 集思阁</div>
    <div class="article-body">
<p>瞻彼洛矣，维水泱泱。君子至止，福禄如茨。韎韐有奭，以作六师。</p><p>瞻彼洛矣，维水泱泱。君子至止，鞸琫有珌。君子万年，保其家室。</p><p>瞻彼洛矣，维水泱泱。君子至止，福禄既同。君子万年，保其家邦。</p>
