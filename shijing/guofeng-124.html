    <h1>葛生</h1>
    <div class="meta">第124篇 · 国风 · 唐风 · 集思阁</div>
    <div class="article-body">
<p>葛生蒙楚，蔹蔓于野。予美亡此，谁与？独处？</p><p>葛生蒙棘，蔹蔓于域。予美亡此，谁与？独息？</p><p>角枕粲兮，锦衾烂兮。予美亡此，谁与？独旦？</p><p>夏之日，冬之夜。百岁之后，归于其居。</p><p>冬之夜，夏之日。百岁之后，归于其室。</p>
