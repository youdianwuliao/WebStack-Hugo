    <h1>溱洧</h1>
    <div class="meta">第95篇 · 国风 · 郑风 · 集思阁</div>
    <div class="article-body">
<p>溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰观乎？士曰既且。且往观乎？</p><p>洧之外，洵訏且乐。维士与女，伊其相谑，赠之以勺药。</p><p>溱与洧，浏其清矣。士与女，殷其盈矣。女曰观乎？士曰既且。且往观乎？</p><p>洧之外，洵訏且乐。维士与女，伊其将谑，赠之以勺药。</p>
