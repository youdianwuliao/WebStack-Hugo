    <h1>天保</h1>
    <div class="meta">第6篇 · 小雅 · 鹿鸣之什 · 集思阁</div>
    <div class="article-body">
<p>天保定尔，亦孔之固。俾尔单厚，何福不除？俾尔多益，以莫不庶。</p><p>天保定尔，俾尔戬穀。罄无不宜，受天百禄。降尔遐福，维日不足。</p><p>天保定尔，以莫不兴。如山如阜，如冈如陵，如川之方至，以莫不增。</p><p>吉蠲为饎，是用孝享。禴祠烝尝，于公先王。君曰：卜尔，万寿无疆。</p><p>神之吊矣，诒尔多福。民之质矣，日用饮食。群黎百姓，遍为尔德。</p><p>如月之恒，如日之升。如南山之寿，不骞不崩。如松柏之茂，无不尔或承。</p>
