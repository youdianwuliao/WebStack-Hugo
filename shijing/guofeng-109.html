    <h1>园有桃</h1>
    <div class="meta">第109篇 · 国风 · 魏风 · 集思阁</div>
    <div class="article-body">
<p>园有桃，其实之肴。心之忧矣，我歌且谣。不知我者，谓我士也骄。</p><p>彼人是哉，子曰何其？心之忧矣，其谁知之？其谁知之，盖亦勿思！</p><p>园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。</p><p>彼人是哉，子曰何其？心之忧矣，其谁知之？其谁知之，盖亦勿思！</p>
