    <h1>巷伯</h1>
    <div class="meta">第40篇 · 小雅 · 节南山之什 · 集思阁</div>
    <div class="article-body">
<p>萋兮斐兮，成是贝锦。彼谮人者，亦已大甚！</p><p>哆兮侈兮，成是南箕。彼谮人者，谁适与谋。</p><p>缉缉翩翩，谋欲谮人。慎尔言也，谓尔不信。</p><p>捷捷幡幡，谋欲谮言。岂不尔受？既其女迁。</p><p>骄人好好，劳人草草。苍天苍天，视彼骄人，矜此劳人。</p><p>彼谮人者，谁适与谋？取彼谮人，投畀豺虎。豺虎不食，投畀有北。有北不受，投畀有昊！</p><p>杨园之道，猗于亩丘。寺人孟子，作为此诗。凡百君子，敬而听之。</p>
