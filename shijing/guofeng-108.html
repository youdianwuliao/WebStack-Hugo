    <h1>汾沮洳</h1>
    <div class="meta">第108篇 · 国风 · 魏风 · 集思阁</div>
    <div class="article-body">
<p>彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。</p><p>彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。</p><p>彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。</p>
