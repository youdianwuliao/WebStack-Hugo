    <h1>匏有苦叶</h1>
    <div class="meta">第34篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>匏有苦叶，济有深涉。深则厉，浅则揭。</p><p>有瀰济盈，有鷕雉鸣。济盈不濡轨，雉鸣求其牡。</p><p>雍雍鸣雁，旭日始旦。士如归妻，迨冰未泮。</p><p>招招舟子，人涉卬否。不涉卬否，卬须我友。</p>
