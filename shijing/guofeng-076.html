    <h1>将仲子</h1>
    <div class="meta">第76篇 · 国风 · 郑风 · 集思阁</div>
    <div class="article-body">
<p>将仲子兮，无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言亦可畏也。</p><p>将仲子兮，无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言亦可畏也。</p><p>将仲子兮，无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言亦可畏也。</p>
