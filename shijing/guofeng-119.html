    <h1>杕杜</h1>
    <div class="meta">第119篇 · 国风 · 唐风 · 集思阁</div>
    <div class="article-body">
<p>有杕之杜，其叶湑湑。独行踽踽。岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不佽焉？</p><p>有杕之杜，其叶箐箐。独行睘睘。岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不佽焉？</p>
