    <h1>采绿</h1>
    <div class="meta">第66篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>终朝采绿，不盈一匊。予发曲局，薄言归沐。</p><p>终朝采蓝，不盈一襜。五日为期，六日不詹。</p><p>之子于狩，言韔其弓。之子于钓，言纶之绳。</p><p>其钓维何？维鲂及鱮。维鲂及鱮，薄言观者。</p>
