    <h1>鼓钟</h1>
    <div class="meta">第48篇 · 小雅 · 谷风之什 · 集思阁</div>
    <div class="article-body">
<p>鼓钟将将，淮水汤汤，忧心且伤。淑人君子，怀允不忘。</p><p>鼓钟喈喈，淮水湝湝，忧心且悲。淑人君子，其德不回。</p><p>鼓钟伐鼛，淮有三洲，忧心且妯。淑人君子，其德不犹。</p><p>鼓钟钦钦，鼓瑟鼓琴，笙磬同音。以雅以南，以龠不僭。</p>
