    <div class="article-body">
<p>孑孑干旄，在浚之郊。素丝纰之，良马四之。彼姝者子，何以畀之？</p><p>孑孑干旟，在浚之都。素丝组之，良马五之。彼姝者子，何以予之？</p><p>孑孑干旌，在浚之城。素丝祝之，良马六之。彼姝者子，何以告之？</p>
