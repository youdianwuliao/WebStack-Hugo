    <h1>蓼莪</h1>
    <div class="meta">第42篇 · 小雅 · 谷风之什 · 集思阁</div>
    <div class="article-body">
<p>蓼蓼者莪，匪莪伊蒿。哀哀父母，生我劬劳。</p><p>蓼蓼者莪，匪莪伊蔚。哀哀父母，生我劳瘁。</p><p>瓶之罄矣，维罍之耻。鲜民之生，不如死之久矣。无父何怙？无母何恃？出则衔恤，入则靡至。</p><p>父兮生我，母兮鞠我。抚我畜我，长我育我，顾我复我，出入腹我。欲报之德。昊天罔极！</p><p>南山烈烈，飘风发发。民莫不穀，我独何害！南山律律，飘风弗弗。民莫不穀，我独不卒！</p>
