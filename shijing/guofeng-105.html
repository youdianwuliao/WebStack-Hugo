    <h1>载驱</h1>
    <div class="meta">第105篇 · 国风 · 齐风 · 集思阁</div>
    <div class="article-body">
<p>载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。</p><p>四骊济济，垂辔沵沵。鲁道有荡，齐子岂弟。</p><p>汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。</p><p>汶水滔滔，行人儦儦。鲁道有荡，齐了游敖。</p>
