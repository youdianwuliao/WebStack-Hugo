    <h1>湛露</h1>
    <div class="meta">第14篇 · 小雅 · 南有嘉鱼之什 · 集思阁</div>
    <div class="article-body">
<p>湛湛露斯，匪阳不晞。厌厌夜饮，不醉无归。</p><p>湛湛露斯，在彼丰草。厌厌夜饮，在宗载考。</p><p>湛湛露斯，在彼杞棘。显允君子，莫不令德。</p><p>其桐其椅，其实离离。岂弟君子，莫不令仪。</p>
