    <h1>扬之水</h1>
    <div class="meta">第116篇 · 国风 · 唐风 · 集思阁</div>
    <div class="article-body">
<p>扬之水，白石凿凿。素衣朱襮，从子于沃。既见君子，云何不乐？</p><p>扬之水，白石皓皓。素衣朱绣，从子于鹄。既见君子，云何其忧？</p><p>扬之水，白石粼粼。我闻有命，不敢以告人。</p>
