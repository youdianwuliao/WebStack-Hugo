    <h1>白华</h1>
    <div class="meta">第69篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>白华菅兮，白茅束兮。之子之远，俾我独兮。</p><p>英英白云，露彼菅茅。天步艰难，之子不犹。</p><p>滮池北流，浸彼稻田。啸歌伤怀，念彼硕人。</p><p>樵彼桑薪，卬烘于煁。维彼硕人，实劳我心。</p><p>鼓钟于宫，声闻于外。念子懆懆，视我迈迈。</p><p>有鹙在梁，有鹤在林。维彼硕人，实劳我心。</p><p>鸳鸯在梁，戢其左翼。之子无良，二三其德。</p><p>有扁斯石，履之卑兮。之子之远，俾我疧兮。</p>
