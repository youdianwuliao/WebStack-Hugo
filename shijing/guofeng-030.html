    <h1>终风</h1>
    <div class="meta">第30篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>终风且暴，顾我则笑，谑浪笑敖，中心是悼。</p><p>终风且霾，惠然肯来，莫往莫来，悠悠我思。</p><p>终风且曀，不日有曀，寤言不寐，愿言则嚏。</p><p>曀曀其阴，虺虺其雷，寤言不寐，愿言则怀。</p>
