    <h1>定之方中</h1>
    <div class="meta">第50篇 · 国风 · 鄘风 · 集思阁</div>
    <div class="article-body">
<p>定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆，爰伐琴桑。</p><p>升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉，终然允臧。</p><p>灵雨既零，命彼倌人，星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千。</p>
