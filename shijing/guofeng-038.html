    <h1>简兮</h1>
    <div class="meta">第38篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>简兮简兮，方将万舞。日之方中，在前上处。</p><p>硕人俣俣，公庭万舞。有力如虎，执辔如组。</p><p>左手执龠，右手秉翟。赫如渥赭，公言锡爵。</p><p>山有榛，隰有苓。云谁之思？西方美人。彼美人兮，西方之人兮。</p>
