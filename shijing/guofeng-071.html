    <h1>葛藟</h1>
    <div class="meta">第71篇 · 国风 · 王风 · 集思阁</div>
    <div class="article-body">
<p>绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾！</p><p>绵绵葛爰，在河之藟。终远兄弟，谓他人母。谓他人母，亦莫我有！</p><p>绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻！</p>
