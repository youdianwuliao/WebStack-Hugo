    <h1>黄鸟</h1>
    <div class="meta">第131篇 · 国风 · 秦风 · 集思阁</div>
    <div class="article-body">
<p>交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。</p><p>临其穴，惴惴其栗。彼苍者天，歼我良人！如可赎兮，人百其身！</p><p>交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。</p><p>临其穴，惴惴其栗。彼苍者天，歼我良人！如可赎兮，人百其身！</p><p>交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。</p><p>临其穴，惴惴其栗。彼苍者天，歼我良人！如可赎兮，人百其身！</p>
