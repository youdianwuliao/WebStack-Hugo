    <h1>殷武</h1>
    <div class="meta">第40篇 · 商颂 · 那之什 · 集思阁</div>
    <div class="article-body">
<p>挞彼殷武，奋伐荆楚。深入其阻，裒荆之旅。有截其所，汤孙之绪。</p><p>维女荆楚，居国南乡。昔有成汤，自彼氐羌，莫敢不来享，莫敢不来王。曰商是常。</p><p>天命多辟，设都于禹之绩。岁事来辟，勿予祸适，稼穑匪解。</p><p>天命降监，下民有严。不僭不滥，不敢怠遑。命于下国，封建厥福。</p><p>商邑翼翼，四方之极。赫赫厥声，濯濯厥灵。寿考且宁，以保我后生。</p><p>陟彼景山，松伯丸丸。是断是迁，方斫是虔。松桷有梴，旅楹有闲，寝成孔安。</p>
