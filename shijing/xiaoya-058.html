    <h1>车舝</h1>
    <div class="meta">第58篇 · 小雅 · 甫田之什 · 集思阁</div>
    <div class="article-body">
<p>间关车之舝兮，思娈季女逝兮。匪饥匪渴，德音来括。虽无好友？式燕且喜。</p><p>依彼平林，有集维鷮。辰彼硕女，令德来教。式燕且誉，好尔无射。</p><p>虽无旨酒？式饮庶几。虽无嘉肴？式食庶几。虽无德与女？式歌且舞？</p><p>陟彼高冈，析其柞薪。析其柞薪，其叶湑兮。鲜我觏尔，我心写兮。</p><p>高山仰止，景行行止。四牡騑騑，六辔如琴。觏尔新婚，以慰我心。</p>
