    <h1>卷耳</h1>
    <div class="meta">第3篇 · 国风 · 周南 · 集思阁</div>
    <div class="article-body">
<p>采采卷耳，不盈顷筐。嗟我怀人，置彼周行。</p><p>陟彼崔嵬，我马虺隤。我姑酌彼金罍，维以不永怀。</p><p>陟彼高冈，我马玄黄。我姑酌彼兕觥，维以不永伤。</p><p>陟彼砠矣，我马瘏矣，我仆痡矣，云何吁矣。</p>
