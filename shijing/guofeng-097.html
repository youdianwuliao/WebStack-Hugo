    <div class="meta">第97篇 · 国风 · 齐风 · 集思阁</div>
    <div class="article-body">
<p>子之还兮，遭我乎狃之间兮。并驱从两肩兮，揖我谓我儇兮。</p><p>子之茂兮，遭我乎狃之道兮。并驱从两牡兮，揖我谓我好兮。</p><p>子之昌兮，遭我乎狃之阳兮。并驱从两狼兮，揖我谓我臧兮。</p>
