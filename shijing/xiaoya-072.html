    <h1>渐渐之石</h1>
    <div class="meta">第72篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>渐渐之石，维其高矣。山川悠远，维其劳矣。武人东征，不遑朝矣。</p><p>渐渐之石，维其卒矣。山川悠远，曷其没矣？武人东征，不遑出矣。</p><p>有豕白蹢，烝涉波矣。月离于毕，俾滂沱矣。武人东征，不皇他矣。</p>
