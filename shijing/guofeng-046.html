    <h1>墙有茨</h1>
    <div class="meta">第46篇 · 国风 · 鄘风 · 集思阁</div>
    <div class="article-body">
<p>墙有茨，不可扫也。中冓之言，不可道也。所可道也，言之丑也。</p><p>墙有茨，不可襄也。中冓之言，不可详也。所可详也，言之长也。</p><p>墙有茨，不可束也。中冓之言，不可读也。所可读也，言之辱也。</p>
