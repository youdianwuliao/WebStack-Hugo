    <h1>皇皇者华</h1>
    <div class="meta">第3篇 · 小雅 · 鹿鸣之什 · 集思阁</div>
    <div class="article-body">
<p>皇皇者华，于彼原隰。駪駪征夫，每怀靡及。</p><p>我马维驹，六辔如濡。载驰载驱，周爰咨诹。</p><p>我马维骐，六辔如丝。载驰载驱，周爰咨谋。</p><p>我马维骆，六辔沃若。载驰载驱，周爰咨度。</p><p>我马维骃，六辔既均。载驰载驱，周爰咨询。</p>
