    <h1>击鼓</h1>
    <div class="meta">第31篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>击鼓其镗，踊跃用兵。土国城漕，我独南行。</p><p>从孙子仲，平陈与宋。不我以归，忧心有忡。</p><p>爰居爰处？爰丧其马？于以求之？于林之下。</p><p>死生契阔，与子成说。执子之手，与子偕老。</p><p>于嗟阔兮，不我活兮。于嗟洵兮，不我信兮。</p>
