    <h1>泽陂</h1>
    <div class="meta">第145篇 · 国风 · 陈风 · 集思阁</div>
    <div class="article-body">
<p>彼泽之陂，有蒲与荷。有美一人，伤如之何？寤寐无为，涕泗滂沱。</p><p>彼泽之陂，有蒲与蕳。有美一人，硕大且卷。寤寐无为，中心悁悁。</p><p>彼泽之陂，有蒲菡萏。有美一人，硕大且俨。寤寐无为，辗转伏枕。</p>
