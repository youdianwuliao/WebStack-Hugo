    <h1>旄丘</h1>
    <div class="meta">第37篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>旄丘之葛兮，何诞之节兮。叔兮伯兮，何多日也？</p><p>何其处也？必有与也！何其久也？必有以也！</p><p>狐裘蒙戎，匪车不东。叔兮伯兮，靡所与同。</p><p>琐兮尾兮，流离之子。叔兮伯兮，褎如充耳。</p>
