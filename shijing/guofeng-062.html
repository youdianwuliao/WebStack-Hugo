    <h1>伯兮</h1>
    <div class="meta">第62篇 · 国风 · 卫风 · 集思阁</div>
    <div class="article-body">
<p>伯兮朅兮，邦之桀兮。伯也执殳，为王前驱。</p><p>自伯之东，首如飞蓬。岂无膏沐？谁适为容！</p><p>其雨其雨，杲杲出日。愿言思伯，甘心首疾。</p><p>焉得谖草？言树之背。愿言思伯。使我心痗。</p>
