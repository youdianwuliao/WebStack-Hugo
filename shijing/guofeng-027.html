    <h1>绿衣</h1>
    <div class="meta">第27篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>绿兮衣兮，绿衣黄裹。心之忧矣，曷维其已！</p><p>绿兮衣兮，绿衣黄裳。心之忧矣，曷维其亡！</p><p>绿兮丝兮，女所治兮。我思古人，俾无訧兮！</p><p>絺兮绤兮，凄其以风。我思古人，实获我心！</p>
