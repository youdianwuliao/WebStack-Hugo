    <h1>棫朴</h1>
    <div class="meta">第4篇 · 大雅 · 文王之什 · 集思阁</div>
    <div class="article-body">
<p>芃芃棫朴，薪之槱之。济济辟王，左右趣之。</p><p>济济辟王，左右奉璋。奉璋峨峨，髦士攸宜。</p><p>淠彼泾舟，烝徒楫之。周王于迈，六师及之。</p><p>倬彼云汉，为章于天。周王寿考，遐不作人？</p><p>追琢其章，金玉其相。勉勉我王，纲纪四方。</p>
