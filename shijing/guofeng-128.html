    <h1>小戎</h1>
    <div class="meta">第128篇 · 国风 · 秦风 · 集思阁</div>
    <div class="article-body">
<p>小戎俴收，五楘梁辀。游环胁驱，阴靷鋈续。文茵畅毂，驾我骐馵。</p><p>言念君子，温其如玉。在其板屋，乱我心曲。</p><p>四牡孔阜，六辔在手。骐骝是中，騧骊是骖。龙盾之合，鋈以觼軜。</p><p>言念君子，温其在邑。方何为期？胡然我念之！</p><p>俴驷孔群，厹矛鋈錞。蒙伐有苑，虎韔镂膺。交韔二弓，竹闭绲縢。</p><p>言念君子，载寝载兴。厌厌良人，秩秩德音。</p>
