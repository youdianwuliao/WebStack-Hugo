    <h1>那</h1>
    <div class="meta">第36篇 · 商颂 · 那之什 · 集思阁</div>
    <div class="article-body">
<p>猗与那与！置我鞉鼓。奏鼓简简，衎我烈祖。汤孙奏假，绥我思成。</p><p>鞉鼓渊渊，嘒嘒管声。既和且平，依我磬声。于赫汤孙！穆穆厥声。</p><p>庸鼓有斁，万舞有奕。我有嘉客，亦不夷怿。自古在昔，先民有作。</p><p>温恭朝夕，执事有恪，顾予烝尝，汤孙之将。</p>
