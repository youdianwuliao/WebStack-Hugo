    <h1>破斧</h1>
    <div class="meta">第157篇 · 国风 · 豳风 · 集思阁</div>
    <div class="article-body">
<p>既破我斧，又缺我斨。周公东征，四国是皇。哀我人斯，亦孔之将。</p><p>既破我斧，又缺我锜。周公东征，四国是遒。哀我人斯，亦孔之嘉。</p><p>既破我斧，又缺我銶。周公东征，四国是遒。哀我人斯，亦孔之休。</p>
