    <h1>南山有台</h1>
    <div class="meta">第12篇 · 小雅 · 南有嘉鱼之什 · 集思阁</div>
    <div class="article-body">
<p>南山有台，北山有莱。乐只君子，邦家之基。乐只君子，万寿无期。</p><p>南山有桑，北山有杨。乐只君子，邦家之光。乐只君子，万寿无疆。</p><p>南山有杞，北山有李。乐只君子，民之父母。乐只君子，德音不已。</p><p>南山有栲，北山有杻。乐只君子，遐不眉寿。乐只君子，德音是茂。</p><p>南山有枸，北山有楰。乐只君子，遐不黄耇。乐只君子，保艾尔后。</p>
