    <h1>鹤鸣</h1>
    <div class="meta">第24篇 · 小雅 · 鸿雁之什 · 集思阁</div>
    <div class="article-body">
<p>鹤鸣于九皋，声闻于野。鱼潜在渊，或在于渚。乐彼之园，爰有树檀，其下维萚。他山之石，可以为错。</p><p>鹤鸣于九皋，声闻于天。鱼在于渚，或潜在渊。乐彼之园，爰有树檀，其下维谷。他山之石，可以攻玉。</p>
