    <h1>我行其野</h1>
    <div class="meta">第28篇 · 小雅 · 鸿雁之什 · 集思阁</div>
    <div class="article-body">
<p>我行其野，蔽芾其樗。婚姻之故，言就尔居。尔不我畜，复我邦家。</p><p>我行其野，言采其蓫。婚姻之故，言就尔宿。尔不我畜，言归斯复。</p><p>我行其野，言采其葍。不思旧姻，求尔新特。成不以富，亦祗以异。</p>
