    <h1>中谷有蓷</h1>
    <div class="meta">第69篇 · 国风 · 王风 · 集思阁</div>
    <div class="article-body">
<p>中谷有蓷，暵其干矣。有女仳离，慨其叹矣。慨其叹矣，遇人之艰难矣。</p><p>中谷有蓷，暵其修矣。有女仳离，条其歗矣。条其歗矣，遇人之不淑矣。</p><p>中谷有蓷，暵其湿矣。有女仳离，啜其泣矣。啜其泣矣，何嗟及矣。</p>
