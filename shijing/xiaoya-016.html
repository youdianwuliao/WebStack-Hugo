    <h1>菁菁者莪</h1>
    <div class="meta">第16篇 · 小雅 · 南有嘉鱼之什 · 集思阁</div>
    <div class="article-body">
<p>菁菁者莪，在彼中阿。既见君子，乐且有仪。</p><p>菁菁者莪，在彼中沚。既见君子，我心则喜。</p><p>菁菁者莪，在彼中陵。既见君子，锡我百朋。</p><p>泛泛杨舟，载沉载浮。既见君子，我心则休。</p>
