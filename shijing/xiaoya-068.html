    <h1>隰桑</h1>
    <div class="meta">第68篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>隰桑有阿，其叶有难。既见君子，其乐如何。</p><p>隰桑有阿，其叶有沃。既见君子，云何不乐。</p><p>隰桑有阿，其叶有幽。既见君子，德音孔胶。</p><p>心乎爱矣，遐不谓矣？中心藏之，何日忘之！</p>
