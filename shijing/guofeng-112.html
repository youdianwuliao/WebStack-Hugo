    <h1>伐檀</h1>
    <div class="meta">第112篇 · 国风 · 魏风 · 集思阁</div>
    <div class="article-body">
<p>坎坎伐檀兮，置之河之干兮。河水清且涟猗。不稼不穑，胡取禾三百廛兮？</p><p>不狩不猎，胡瞻尔庭有县貆兮？彼君子兮，不素餐兮！</p><p>坎坎伐辐兮，置之河之侧兮。河水清且直猗。不稼不穑，胡取禾三百亿兮？</p><p>不狩不猎，胡瞻尔庭有县特兮？彼君子兮，不素食兮！</p><p>坎坎伐轮兮，置之河之漘兮。河水清且沦猗。不稼不穑，胡取禾三百囷兮？</p><p>不狩不猎，胡瞻尔庭有县鹑兮？彼君子兮，不素飧兮！</p>
