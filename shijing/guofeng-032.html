    <h1>凯风</h1>
    <div class="meta">第32篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>凯风自南，吹彼棘心。棘心夭夭，母氏劬劳。</p><p>凯风自南，吹彼棘薪。母氏圣善，我无令人。</p><p>爰有寒痊？在浚之下。有子七人，母氏劳苦。</p><p>睍睆黄鸟，载好其音。有子七人，莫慰母心。</p>
