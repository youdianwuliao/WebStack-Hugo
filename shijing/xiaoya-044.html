    <h1>四月</h1>
    <div class="meta">第44篇 · 小雅 · 谷风之什 · 集思阁</div>
    <div class="article-body">
<p>四月维夏，六月徂署。先祖匪人，胡宁忍予？</p><p>秋日凄凄，百卉具腓。乱离瘼矣，爰其适归？</p><p>冬日烈烈，飘风发发。民莫不穀，我独何害？</p><p>山有嘉卉，侯栗侯梅。废为残贼，莫知其尤！</p><p>相彼泉水，载清载浊。我日构祸，曷云能穀？</p><p>滔滔江汉，南国之纪。尽瘁以仕，宁莫我有？</p><p>匪鹑匪鸢，翰飞戾天。匪鳣匪鲔，潜逃于渊。</p><p>山有蕨薇，隰有杞桋。君子作歌，维以告哀。</p>
