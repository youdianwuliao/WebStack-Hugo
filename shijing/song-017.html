    <h1>雝</h1>
    <div class="meta">第17篇 · 周颂 · 臣工之什 · 集思阁</div>
    <div class="article-body">
<p>有来雝雝，至止肃肃。相维辟公，天子穆穆。于荐广牡，相予四祀。假哉皇考！绥予孝子。</p><p>宣哲维人，文武维后。燕及皇天，克昌厥后。绥我眉寿，介以繁祉，既右烈考，亦右文母。</p>
