    <h1>草虫</h1>
    <div class="meta">第14篇 · 国风 · 召南 · 集思阁</div>
    <div class="article-body">
<p>喓喓草虫，趯趯阜螽。未见君子，忧心忡忡。亦既见止，亦既觏止，我心则降。</p><p>陟彼南山，言采其蕨。未见君子，忧心惙惙。亦既见止，亦既觏止，我心则说。</p><p>陟彼南山，言采其薇。未见君子，我心伤悲。亦既见止，亦既觏止，我心则夷。</p>
