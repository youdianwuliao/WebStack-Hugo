    <h1>北门</h1>
    <div class="meta">第40篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！</p><p>王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！</p><p>王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！</p>
