    <h1>女曰鸡鸣</h1>
    <div class="meta">第82篇 · 国风 · 郑风 · 集思阁</div>
    <div class="article-body">
<p>女曰鸡鸣，士曰昧旦。子兴视夜，明星有烂。将翱将翔，弋凫与雁。</p><p>弋言加之，与子宜之。宜言饮酒，与子偕老。琴瑟在御，莫不静好。</p><p>知子之来之，杂佩以赠之。知子之顺之，杂佩以问之。知子之好之，杂佩以报之。</p>
