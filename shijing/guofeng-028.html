    <h1>燕燕</h1>
    <div class="meta">第28篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>燕燕于飞，差池其羽。之子于归，远送于野。瞻望弗及，泣涕如雨。</p><p>燕燕于飞，颉之颃之。之子于归，远于将之。瞻望弗及，伫立以泣。</p><p>燕燕于飞，下上其音。之子于归，远送于南。瞻望弗及，实劳我心。</p><p>仲氏任只，其心塞渊。终温且惠，淑慎其身。先君之思，以勖寡人。</p>
