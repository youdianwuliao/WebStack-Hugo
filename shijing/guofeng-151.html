    <h1>候人</h1>
    <div class="meta">第151篇 · 国风 · 曹风 · 集思阁</div>
    <div class="article-body">
<p>彼候人兮，何戈与祋。彼其之子，三百赤芾。</p><p>维鹈在梁，不濡其翼。彼其之子，不称其服。</p><p>维鹈在梁，不濡其咮。彼其之子，不遂其媾。</p><p>荟兮蔚兮，南山朝隮。婉兮娈兮，季女斯饥。</p>
