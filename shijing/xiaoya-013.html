    <h1>蓼萧</h1>
    <div class="meta">第13篇 · 小雅 · 南有嘉鱼之什 · 集思阁</div>
    <div class="article-body">
<p>蓼彼萧斯，零露湑兮。既见君子，我心写兮。燕笑语兮，是以有誉处兮。</p><p>蓼彼萧斯，零露瀼瀼。既见君子，为龙为光。其德不爽，寿考不忘。</p><p>蓼彼萧斯，零露泥泥。既见君子，孔燕岂弟。宜兄宜弟，令德寿岂。</p><p>蓼彼萧斯，零露浓浓。既见君子，鞗革忡忡。和鸾雍雍，万福攸同。</p>
