    <h1>角弓</h1>
    <div class="meta">第63篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>骍骍角弓，翩其反矣。兄弟婚姻，无胥远矣。</p><p>尔之远矣，民胥然矣。尔之教矣，民胥效矣。</p><p>此令兄弟，绰绰有裕。不令兄弟，交相为愈。</p><p>民之无良，相怨一方。受爵不让，至于已斯亡。</p><p>老马反为驹，不顾其后。如食宜饇，如酌孔取。</p><p>毋教猱升木，如涂涂附。君子有徽猷，小人与属。</p><p>雨雪瀌瀌，见晛曰消。莫肯下遗，式居娄骄。</p><p>雨雪浮浮，见晛曰流。如蛮如髦，我是用忧。</p>
