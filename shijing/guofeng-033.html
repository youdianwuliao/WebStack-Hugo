    <h1>雄雉</h1>
    <div class="meta">第33篇 · 国风 · 邶风 · 集思阁</div>
    <div class="article-body">
<p>雄雉于飞，泄泄其羽。我之怀矣，自诒伊阻。</p><p>雄雉于飞，下上其音。展矣君子，实劳我心。</p><p>瞻彼日月，悠悠我思。道之云远，曷云能来？</p><p>百尔君子，不知德行。不忮不求，何用不臧。</p>
