    <h1>烈祖</h1>
    <div class="meta">第37篇 · 商颂 · 那之什 · 集思阁</div>
    <div class="article-body">
<p>嗟嗟烈祖！有秩斯祜。申锡无疆，及尔斯所。既载清酤，赉我思成。</p><p>亦有和羹，既戒既平。鬷假无言，时靡有争。绥我眉寿，黄耇无疆。</p><p>约軧错衡，八鸾鸧鸧。以假以享，我受命溥将。自天降康，丰年穰穰。</p><p>来假来飨，降福无疆。顾予烝尝，汤孙之将。</p>
