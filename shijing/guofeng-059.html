    <h1>竹竿</h1>
    <div class="meta">第59篇 · 国风 · 卫风 · 集思阁</div>
    <div class="article-body">
<p>籊籊竹竿，以钓于淇。岂不尔思？远莫致之。</p><p>泉源在左，淇水在右。女子有行，远兄弟父母。</p><p>淇水在右，泉源在左。巧笑之瑳，佩玉之傩。</p><p>淇水滺滺，桧楫松舟。驾言出游，以写我忧。</p>
