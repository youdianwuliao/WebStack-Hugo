    <h1>晨风</h1>
    <div class="meta">第132篇 · 国风 · 秦风 · 集思阁</div>
    <div class="article-body">
<p>鴥彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何，忘我实多！</p><p>山有苞栎，隰有六駮。未见君子，忧心靡乐。如何如何，忘我实多！</p><p>山有苞棣，隰有树檖。未见君子，忧心如醉。如何如何，忘我实多！</p>
