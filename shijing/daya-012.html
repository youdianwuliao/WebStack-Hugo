    <h1>行苇</h1>
    <div class="meta">第12篇 · 大雅 · 生民之什 · 集思阁</div>
    <div class="article-body">
<p>敦彼行苇，牛羊勿践履。方苞方体，维叶泥泥。</p><p>戚戚兄弟，莫远具尔。或四之筵，或授之几。</p><p>四筵设席，授几有缉御。或献或酢，洗爵奠斝。</p><p>醓醢以荐，或燔或炙。嘉肴脾臄，或歌或咢。</p><p>敦弓既坚，四鍭既均，舍矢既均，序宾以贤。</p><p>敦弓既句，既挟四鍭。四鍭如树，序宾以不侮。</p><p>曾孙维主，酒醴维醽，酌以大斗，以祈黄耇。</p><p>黄耇台背，以引以翼。寿考维祺，以介景福。</p>
