    <h1>桑扈</h1>
    <div class="meta">第55篇 · 小雅 · 甫田之什 · 集思阁</div>
    <div class="article-body">
<p>交交桑扈，有莺其羽。君子乐胥，受天之祜。</p><p>交交桑扈，有莺其领。君子乐胥，万邦之屏。</p><p>之屏之翰，百辟为宪。不戢不难，受福不那。</p><p>兕觥其觩，旨酒思柔。彼交匪敖，万福来求。</p>
