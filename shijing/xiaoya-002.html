    <h1>四牡</h1>
    <div class="meta">第2篇 · 小雅 · 鹿鸣之什 · 集思阁</div>
    <div class="article-body">
<p>四牡騑騑，周道倭迟。岂不怀归？王事靡盬，我心伤悲。</p><p>四牡騑騑，啴啴骆马。岂不怀归？王事靡盬，不遑启处。</p><p>翩翩者鵻，载飞载下，集于苞栩。王事靡盬，不遑将父。</p><p>翩翩者鵻，载飞载止，集于苞杞。王事靡盬，不遑将母。</p><p>驾彼四骆，载骤骎骎。岂不怀归？是用作歌，将母来谂。</p>
