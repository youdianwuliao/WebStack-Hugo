    <h1>杕杜</h1>
    <div class="meta">第9篇 · 小雅 · 鹿鸣之什 · 集思阁</div>
    <div class="article-body">
<p>有杕之杜，有睆其实。王事靡盬，继嗣我日。日月阳止，女心伤止，征夫遑止。</p><p>有杕之杜，其叶萋萋。王事靡盬，我心伤悲。卉木萋止，女心悲止，征夫归止！</p><p>陟彼北山，言采其杞。王事靡盬，忧我父母。檀车幝幝，四牡痯痯，征夫不远！</p><p>匪载匪来，忧心孔疚。斯逝不至，而多为恤。卜筮偕止，会言近止，征夫迩止！</p>
