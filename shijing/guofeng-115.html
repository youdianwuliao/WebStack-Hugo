    <h1>山有枢</h1>
    <div class="meta">第115篇 · 国风 · 唐风 · 集思阁</div>
    <div class="article-body">
<p>山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。</p><p>山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。</p><p>山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。</p>
