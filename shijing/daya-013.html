    <h1>既醉</h1>
    <div class="meta">第13篇 · 大雅 · 生民之什 · 集思阁</div>
    <div class="article-body">
<p>既醉以酒，既饱以德。君子万年，介尔景福。</p><p>既醉以酒，尔肴既将。君子万年，介尔昭明。</p><p>昭明有融，高朗令终，令终有俶。公尸嘉告。</p><p>其告维何？笾豆静嘉。朋友攸摄，摄以威仪。</p><p>威仪孔时，君子有孝子。孝子不匮，永锡尔类。</p><p>其类维何？室家之壶。君子万年，永锡祚胤。</p><p>其胤维何？天被尔禄。君子万年，景命有仆。</p><p>其仆维何？厘尔女士。厘尔女士，从以孙子。</p>
