    <h1>南有嘉鱼</h1>
    <div class="meta">第11篇 · 小雅 · 南有嘉鱼之什 · 集思阁</div>
    <div class="article-body">
<p>南有嘉鱼，烝然罩罩。君子有酒，嘉宾式燕以乐。</p><p>南有嘉鱼，烝然汕汕。君子有酒，嘉宾式燕以衎。</p><p>南有樛木，甘瓠累之。君子有酒，嘉宾式燕绥之。</p><p>翩翩者鵻，烝然来思。君子有酒，嘉宾式燕又思。</p>
