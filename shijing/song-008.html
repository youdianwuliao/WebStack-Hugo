    <h1>时迈</h1>
    <div class="meta">第8篇 · 周颂 · 清庙之什 · 集思阁</div>
    <div class="article-body">
<p>时迈其邦，昊天其子之，实右序有周。薄言震之，莫不震叠。怀柔百神，及河乔岳，允王维后。</p><p>明昭有周，式序在位。载戢干戈，载橐弓矢。我求懿德，四于时夏，允王保之。</p>
