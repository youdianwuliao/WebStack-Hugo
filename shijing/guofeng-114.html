    <h1>蟋蟀</h1>
    <div class="meta">第114篇 · 国风 · 唐风 · 集思阁</div>
    <div class="article-body">
<p>蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。</p><p>蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。</p><p>蟋蟀在堂，役车其休。今我不乐，日月其慆。无以大康。职思其忧。好乐无荒，良士休休。</p>
