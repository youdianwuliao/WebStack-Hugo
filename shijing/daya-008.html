    <h1>灵台</h1>
    <div class="meta">第8篇 · 大雅 · 文王之什 · 集思阁</div>
    <div class="article-body">
<p>经始灵台，经之营之。庶民攻之，不日成之。经始勿亟，庶民子来。</p><p>王在灵囿，麀鹿攸伏。麀鹿濯濯，白鸟翯翯。王在灵沼，于牣鱼跃。</p><p>虡业维枞，贲鼓维镛。于论鼓钟，于乐辟雍。</p><p>于论鼓钟，于乐辟雍。鼍鼓逢逢。矇瞍奏公。</p>
