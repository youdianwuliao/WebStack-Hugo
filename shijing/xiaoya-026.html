    <h1>白驹</h1>
    <div class="meta">第26篇 · 小雅 · 鸿雁之什 · 集思阁</div>
    <div class="article-body">
<p>皎皎白驹，食我场苗。絷之维之，以永今朝。所谓伊人，于焉逍遥？</p><p>皎皎白驹，食我场藿。絷之维之，以永今夕。所谓伊人，于焉嘉客？</p><p>皎皎白驹，贲然来思。尔公尔侯，逸豫无期？慎尔优游，勉尔遁思。</p><p>皎皎白驹，在彼空谷。生刍一束，其人如玉。毋金玉尔音，而有遐心。</p>
