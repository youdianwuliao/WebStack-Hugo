    <h1>旱麓</h1>
    <div class="meta">第5篇 · 大雅 · 文王之什 · 集思阁</div>
    <div class="article-body">
<p>瞻彼旱麓，榛楛济济。岂弟君子，干禄岂弟。</p><p>瑟彼玉瓒，黄流在中。岂弟君子，福禄攸降。</p><p>鸢飞戾天，鱼跃于渊。岂弟君子，遐不作人？</p><p>清酒既载，骍牡既备。以享以祀，以介景福。</p><p>瑟彼柞棫，民所燎矣。岂弟君子，神所劳矣。</p><p>莫莫葛藟，施于条枚。岂弟君子，求福不回。</p>
