    <h1>车攻</h1>
    <div class="meta">第19篇 · 小雅 · 南有嘉鱼之什 · 集思阁</div>
    <div class="article-body">
<p>我车既攻，我马既同。四牡庞庞，驾言徂东。</p><p>田车既好，田牡孔阜。东有甫草，驾言行狩。</p><p>之子于苗，选徒嚣嚣。建旐设旄，搏兽于敖。</p><p>驾彼四牡，四牡奕奕。赤芾金舄，会同有绎。</p><p>决拾既佽，弓矢既调。射夫既同，助我举柴。</p><p>四黄既驾，两骖不猗。不失其驰，舍矢如破。</p><p>萧萧马鸣，悠悠旆旌。徒御不惊，大庖不盈。</p><p>之子于征，有闻无声。允矣君子，展也大成。</p>
