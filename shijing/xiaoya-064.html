    <h1>菀柳</h1>
    <div class="meta">第64篇 · 小雅 · 鱼藻之什 · 集思阁</div>
    <div class="article-body">
<p>有菀者柳，不尚息焉。上帝甚蹈，无自暱焉。俾予靖之，后予极焉。</p><p>有菀者柳，不尚愒焉。上帝甚蹈，无自瘵焉。俾予靖之，后予迈焉。</p><p>有鸟高飞，亦傅于天。彼人之心，于何其臻。曷予靖之，居以凶矜。</p>
