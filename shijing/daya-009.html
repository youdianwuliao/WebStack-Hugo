    <h1>下武</h1>
    <div class="meta">第9篇 · 大雅 · 文王之什 · 集思阁</div>
    <div class="article-body">
<p>下武维周，世有哲王。三后在天，王配于京。</p><p>王配于京，世德作求。永言配命，成王之孚。</p><p>成王之孚，下土之式。永言孝思，孝思维则。</p><p>媚兹一人，应侯顺德。永言孝思，昭哉嗣服。</p><p>昭兹来许，绳其祖武。于万斯年，受天之祜。</p><p>受天之祜，四方来贺。于万斯年，不遐有佐。</p>
