<p>鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。</p><p>东方明矣，朝既昌矣。匪东方则明，月出之光。</p><p>虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。</p>
