<p>驷驖孔阜，六辔在手。公之媚子，从公于狩。</p><p>奉时辰牡，辰牡孔硕。公曰左之，舍拔则获。</p><p>游于北园，四马既闲。輶车鸾镳，载猃歇骄。</p>
