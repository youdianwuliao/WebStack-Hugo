    <h1>收粮违限</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>收粮违限凡收夏税，于五月十五终齐足，秋粮十月初一曰开仓，十二月终齐足。如早收去处，预先收受者，不拘此律。</p><p>若夏税违限至八月终，秋粮违限至次年正月终不足者，其提调部粮官、吏典、分催里长、欠粮人户，各以十分为率，一分不足者，杖六十，每一分加一等，罪止杖一百。更财者，计赃以枉法从重论。若长杖一百，吏典处绞。</p>
