    <h1>放火故烧人房屋</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>放火故烧人房屋凡放火故烧自己房屋者，杖一百。若延烧官民房屋及积聚之物者，杖一百，徒三年。因而盗取财物者斩。</p><p>杀伤人者，以故杀伤论。○若放火故烧官民房屋及公廨仓库、系官积聚之物，诸皆斩。其故烧人空闲房屋及田场积聚之物者，各减一等。〇，并计所烧之物减价，尽犯人财产还官给主。</p>
