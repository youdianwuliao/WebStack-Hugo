    <h1>禁经断人充宿卫</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>禁经断人充宿卫凡在京城犯罪，被极刑之家，同居人口，随即迁发别郡住坐，其亲属人等并一应经断之人，并不得入充近侍及宿卫，守把皇城、京城门禁。若朦胧充当者斩。其当该官司不为用心详审，或听人嘱托及受财容令充当者，罪。有特旨选充，曾经覆奏，明立失案者，不在此限。</p>
