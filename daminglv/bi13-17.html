    <h1>悬带关防牌面</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>悬带关防牌面凡朝参文武官及内官悬带牙牌、铁牌，厨子、校尉入内，各带铜木牌面。如有遗失，官罚钞二十贯，厨子、校尉罚钞一十贯。若有拾得，随即报官者，将各人𫍧罚钞贯充赏。有牌不带，无牌辄杖八十。借者及借与者杖一百。事有规避者，从重论。隐藏者杖一百，徒三年。首告者于犯人名下追钞五十贯充赏。</p><p>诈带朝参及在外诈称官员名号，有所求为者绞，伪造者斩。首告者于犯人名下追钞一百贯充赏。</p>
