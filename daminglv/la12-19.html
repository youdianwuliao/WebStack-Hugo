    <h1>丧葬</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>丧葬凡有丧之家，必须依礼安葬，若惑于风水，及托故停柩，在家经年，𭧂露不韦者，杖八十。○其从尊长遗言，将尸烧化及弃置水中者，杖一百，卑幼并减二等。若亡殁远方，子孙不能归葬而烧化者，听从其便。遒其居丧之家，修斋设醮，若男女溷杂，饮酒食肉者，家长杖八十，僧道同罪还俗。</p>
