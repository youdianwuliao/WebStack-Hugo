    <h1>诈为瑞应</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>诈为瑞应凡诈为瑞应者，杖六十，徒一年○若有灾祥之类，而钦天监官不以实对者，加二等。</p><p>诈病死伤避事</p><p>凡官吏人等，诈称疾病，临事避难者，笞四十；事重者杖八十○若犯罪待对，故自伤残者，杖一百；诈死者杖一百，徒三年。所避事重者，各从重论。若无避，故自伤残者，杖八十。其受雇倩为人伤残者，与犯人同罪。因而致死者，减斗杀。</p><p>曰</p>
