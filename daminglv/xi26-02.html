<p>夫匠军士病给医药凡军士在镇守之处，丁夫杂匠在工役之所，而有疾病，当侠官司不为请给医药救疗，诸笞四十；因而致死者，杖八十。若已行移所司，而不差拨良医，及不给对证药饵医治者，罪同。</p>
