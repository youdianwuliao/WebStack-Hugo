    <h1>出妻</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>出妻凡妻无应出及义绝之状而出之者，杖八十。虽犯七出，有三不去而出之者，减二等，追还。犯义绝应离，离者亦杖八十。若夫妻不相和谐而两愿离者，不坐。</p><p>○若从夫嫁卖，因而改嫁者绞。其因夫逃亡，三年之内，不告官司而逃去者，杖八十；擅改嫁者，杖一百，妾各减二等。首若埠背家长在逃者，杖八十；因而改嫁者，杖一百，给还家长。</p><p>不及知情娶者，各与同罪。至死者减一等，不知者俱不坐○若由期亲以上婚改嫁者，罪坐主婚妻妾，止女为从，事由男女，男女为首，主婚为从，至死者，主婚人并减一等。</p>
