    <h1>宿卫守卫人私自代替</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>宿卫守卫人私自代替凡宫禁宿卫及皇城门守卫人应直不直者，笞四十；以应宿卫守卫人私自代替及替之人各杖六十；以别卫不孙宿卫守卫人冒私自代替及替之人各杖一百。百户以上各加一等。人若在直而逃者，罪亦如之。○京城门减一等，各处城门又减二等。亲管头目知而故纵者，各与犯人同罪。失觉察者减三等。有故而赴所管告知者不坐。</p>
