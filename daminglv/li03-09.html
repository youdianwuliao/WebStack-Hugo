    <h1>照刷警卷</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>照刷警卷凡照刷有司有印信衙门外卷迟一宗、二宗，吏典笞一十，三宗至五宗，笞二十，每五宗加二等罪。首领官及仓库、务场、局所、河泊等官，各减一等。</p><p>百。失错及漏报一宗，吏典笞二十，二宗、三宗笞三十，每三宗加一等，罪止笞五十。府州县首领官及仓库、务场、局所、河泊等官各减一等。其府州县正官、巡检，一宗至五宗，罚俸钱一十日；每五宗加一等，罚止一月，枉等论。</p>
