    <h1>称与同罪</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>称与同罪凡称与同罪者，止坐其罪，至死者减一等，罪止杖一百，流三千里，不在刺字、绞斩之律。若受财故纵，与同罪者全科，其故纵、谋反、逆叛者，皆依本律。〇称准枉法论、准盗论之类，但准其罪，亦罪止杖一百、流三千里，并免刺字。称以枉法论及以盗论之类，皆与真犯同，刺字、绞斩，皆依本律科断。</p>
