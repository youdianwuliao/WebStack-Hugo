    <h1>文武官犯私罪</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>文武官犯私罪凡文武官犯私罪，笞四十以下，附过还职，五十解见任，降俱解见任。流官于杂职内叙用，杂职于边远叙用；杖一百者，罢职不叙。○若军官有犯私罪，该笞者，附过收赎；杖罪解见任，降等叙用；该罢职不叙者，降充总旗；该徒流者，照依地里远近，发各卫充军。若建立事功，不次擢用。○若未入流，十罢见役，别叙。杖罪并罢职役不叙。</p>
