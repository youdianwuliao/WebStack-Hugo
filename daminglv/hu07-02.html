    <h1>钱法</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>钱法凡钱法，设立宝源等局，鼓铸洪武通宝铜钱，与大中通宝及历代铜钱相兼行使，三当五、当十，依数准算。</p><p>民间金银、米麦、布帛诸物价钱，并依时直，听从民便。若阻滞不即行使者，杖六十。镜子器及寺观庵院钟磬、铙钕外，其余应有废铜，并听赴官中卖，每斤给价铜钱一百五十外。若私相买卖，及收匿在家，不赴官中卖者，各笞四十。</p>
