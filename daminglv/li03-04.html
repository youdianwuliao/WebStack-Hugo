    <h1>上书奏事犯讳</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>上书奏事犯讳凡上书若奏事，误犯御名及庙讳者，杖八十。余萧书误犯者，笞四十。若为名字触犯者，杖一百。其所犯御名及庙讳，声音相似，字样分别，及有三字止犯一字者，皆不坐罪。〇。若上书及奏事错误，当言原免而言不免，当言十石之类，有害于事者，杖六十。申六部错误，有害于事者，笞四十。其余衙门惊书错误者，笞二十。若所申虽有错误，而文案可行，不害于事者，勿论。</p>
