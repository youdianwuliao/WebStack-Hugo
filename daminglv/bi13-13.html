    <h1>冲突仪仗</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>冲突仪仗凡车驾行处，除近侍及宿卫护驾官军外，其余军民并须回避，冲入仪仗内者绞。若在郊野之外，一时不能回避者，听俯伏以待。其久武百官非奉宣唤，无故辄入仪仗内者，杖一百。典仗护卫官军故纵者，与犯人同罪，不觉者减三等。</p><p>凡有申诉冤抑者，止许于仗外俯伏以听。若冲入仪仗内，而所诉事不实者绞，得实者免罪。</p><p>凡军民之家纵放牲畜，若守卫不备，因而冲突仪仗者，杖坐卫坐背，卫八十。冲入皇城门内者，杖一百。</p>
