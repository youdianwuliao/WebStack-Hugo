<p>服舍违式凡官民房舍、车服器物之类，各有等第。若违式僭用，有官者杖一、五十。○若僭用违禁龙凤外者，官、民各杖一百，徒三年；工匠杖一百，连当房家小起发赴京，籍充局匠。违禁之物并入官。○首告者，官给赏银五十两○若工匠能自首者，免罪，一体给赏。</p>
