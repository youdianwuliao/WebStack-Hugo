<p>封掌印信凡内外各衙门印信，长官收掌，同僚佐贰官用纸于印面上封记，俱各画字。若同僚佐贰官者，杖一百。漏使印信凡各衙门行移出外文书，漏使印信者，当该吏典对同首领官并全不，各杖八十。○干碍调拨军马，供给边方军需钱粮者，各杖一百。因而失误军机者斩。</p>
