    <h1>称监临主守</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>称监临主守凡称监临者，内外诸司统摄所属，有文案相关涉，及虽非所管百姓，但有事在手者，即为监临。称主守者，唊管文案吏典专主掌其事，及守掌仓库、狱囚、杂物之类，官吏、库子、斗级、攒拦、禁子，并为主守人。其职虽非统属，但临时差遣管领提调者，亦是监临主守。</p>
