    <h1>徒流人又犯罪</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>徒流人又犯罪凡犯罪已发又犯罪者，从重科断；已徒、已流而又犯罪者，依律再科后犯之罪。其重犯流者，依留住法，三流并决杖一百，于配所拘役四年。若犯徒者，依所犯杖数该徒年限决讫，应役，亦总不得过四年。其杖罪以下，亦各依数决之。其应加杖者亦如之。老小废疾收赎。</p><p>凡年七十以上、十五以下及废疾，犯流罪以下收赎；八十以上、十岁以下及笃疾，犯反杀人应死者，议拟奏闻，取自上裁。盗及伤人者亦收赎，余皆勿论。九十以上、七岁以下，虽有死罪，不加。其有人教令，坐其教令者。若有赋应偿，受赃者偿之。</p>
