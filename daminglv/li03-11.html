    <h1>增减官文书</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>增减官文书凡增减官文书者，杖六十。若有所规避，杖罪以上，各加本罪二等，罪止杖一百，流三千里；未施行者，各减一等。</p><p>规避死罪者，依常律。其当该官吏自有所避增减文案者，罪同。若增减以避迟错者，笞四十。</p><p>○若行移久书，误将军马钱粮、刑名重事紧关字样传写失错而洗补改正者，吏典笞三十。首领官失于对同，减一等。千碍调拨军马及供给边方军需钱粮数目者，首领官、吏典皆杖八十。若有规避故改补者，以增减官久书论。未施行者，各减一等。因而失误军机者，无问故失并斩。若无规避及常行字样，偶然误写者，皆勿论。</p>
