    <h1>妻妾殴夫</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>妻妾殴夫凡妻殴夫者，杖一百。夫愿离者听。至折伤以上，各力凡伤三。疾者绞，死者斩，故杀者凌迟处死。若妾欧夫及正妻者，又各加三等。加者，加入于死下。</p><p>其夫殴妻非折伤勿论，至折伤以上，减凡人二等。先行审问，夫妇如愿离异者，断罪离异；不愿离异者，验罪收赎。至死者绞。殴伤妾至折伤以上，减殴伤妻三等，至死者杖一百，徒三年。妻殴伤妾，与夫欧妻罪同。过失杀者，各勿论。</p><p>○若殴妻之父母者，杖一百，折伤以上，各加凡。</p><p>斗伤罪一等，至笃疾者绞，死者斩。</p>
