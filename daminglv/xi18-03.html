    <h1>造妖书妖言</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>造妖书妖言凡造谶纬、妖书、妖言、妖书，隐藏不送官者，杖一百，徒三年。盗大祀神御物凡盗大祀神祗御用祭器、帷帐等物，及盗飨荐玉帛、牲牢。其未进神御及营造未成，若已奉祭讫之物，及其余官物，皆杖一百，徒三年。若计重，并罪一等，刺字。</p>
