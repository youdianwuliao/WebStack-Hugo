    <h1>官吏给由</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>官吏给由凡各衙门官吏给由到吏部，限五曰付勘完备，以凭类选铨注。若不即付勘完备者，迟一曰，吏典笞一十，每二曰加一等，罪止笞四十，首减二等。〇。</p><p>若公私过名隐漏不报者，以所隐之罪坐之。若罚赎记过者，亦各以所罚所记之罪坐之。若报重罪为轻罪者，坐以所符同。隐漏者，与同罪。承报而差漏，及上司失于沓照者，并以失错漏报卷宗科断。○其附三人，吏典笞一十，每三人加一等，罪止笞四十○若有增减更易地方，改换出身，蔽者，并杖百，罢职役不叙。</p><p>○有所规避及受炫者，各从重论。</p>
