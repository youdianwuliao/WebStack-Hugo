    <h1>死囚令父自杀</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>死囚令父自杀凡死罪四，已招服罪而囚使令亲戚、故旧自杀，或令雇倩人杀之者，亲故及下手之人各。</p><p>虽杀及杀而未招服罪，辄杀讫或雇倩人杀之者，亲故及下手之人各以斗杀伤论。○若虽已招服罪，而囚之子孙为祖父母、父母及奴婢。</p>
