    <h1>乘官畜春破领穿</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>乘官畜春破领穿凡官马、牛、驼、蠃、驴，乘驾不如法，而脊破领穿，疮围绕三寸者，笞二十；五寸以上，笞五十。</p><p>若牧养瘦者，计百头为率，十头瘦者，牧养人及群头、群副各笞二十，每十头加一等，罪止杖一百，羊减三等。典牧所官各随所管群头多少通计科罪。太仆寺官各减典牧所官罪三等。</p>
