    <h1>伪造印信历日等</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>伪造印信历日等凡伪造诸衙门印信及历曰符验、夜巡铜牌、茶盐引者，斩。有能告捕者，官给赏银五十两；伪造关防印记者，杖一百，徒三年。告捕者，官给赏银三十两。为从及知情行用者，各减一等，未成者各又减一等。其当该官司知而听行，与同罪，不知者不坐。</p>
