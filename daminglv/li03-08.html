    <h1>官久书稽程</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>官久书稽程凡官文书稽程者，一曰吏典笞一十，三曰加一等，罪止笞四十。首领官各减一等。人若各衙门遇有所属申禀公事，随即详议可否，明白定夺回报。若当该官吏不与果决，含糊行移，互相推调，以致躭误公事者，杖八十。其所属将可行事件不行区处，作疑果决，行移或有未绝，或不完者，自依官文。</p>
