    <h1>殴制使及本管长官</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>殴制使及本管长官凡奉制命出使，而官吏殴之，及部民殴本属知府、知州、知县，军士殴本管指挥、千户、百户，若吏卒殴本部五品以上长官，杖一百，徒三年；伤者杖一百，流二千里；折伤者绞。若殴六品以下长官，各减三等，殴佐贰官、首领官，又各递减一等，罪轻一等。笃疾者绞。官及三品以上官者，杖八十，徒二年；伤者杖一百，徒三年；折伤者杖一百，流二千里；殴伤五品以上官者，减二等。若减罪轻及殴伤九品以上官者，各加。</p><p>凡斗伤二等人，其公使人在外殴打有司官者，罪亦如之，从所属上司拘问。</p>
