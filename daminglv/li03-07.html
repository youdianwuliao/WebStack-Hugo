    <h1>漏泄军情大事</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>漏泄军情大事凡闻知朝廷及总兵将军调兵讨袭外蕃，及收捕反逆贼徒机密大事，而辄漏泄于敌人者斩。若边将报到军情重事而漏泄者，杖一百，徒三年，仍以先传说者为首，传至者为从减一等。○若私开官司文书、印封看视者，杖六十。事于军情重事者，以漏泄论。○若近侍官员漏泄机密重事于人者斩，常事杖一百，罢职不叙。</p>
