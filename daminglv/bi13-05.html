    <h1>直行御道</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>直行御道凡午门外御道至御桥，除侍卫官军导从车驾出入，许于东西两傍行走外，其余文武百官、军民人等，无故于上直行及辄度御桥诸，杖八十。若于宫殿中直行御道者，杖一百。守卫官故纵者，各与犯人同罪。失觉察者减三等。若于御道上横过，系一时经行者，不在此限。</p>
