    <h1>奸党</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>奸党凡奸邪进谗言左使杀人者斩。口若犯罪，律该处死，其大臣小官巧言谏免，暗邀人心者，亦斩。○若在朝官员交结朋党，紊乱朝政者，皆斩，妻子为奴，财产入官。○若刑部及大小各衙门官吏，不执法律，听从上司主使，出入人罪者，罪亦如之。若有不避权势，明具实迹，亲赴御前执法陈诉者，罪坐奸臣。言告之人，与免本罪，仍将犯人财产均给充赏。有官者升二等，无官者量与一官，或赏银二千两。</p>
