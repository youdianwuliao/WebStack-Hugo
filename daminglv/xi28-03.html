    <h1>淹禁</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>淹禁凡狱囚情犯已完，监察御史、提刑、按察司审录无冤，别无追勘事理，应断决者，限三日内断决；应起发诸限一十日内起发。若限外不断决、不起发者，当该官吏三日笞二十，每三日加一等，罪止杖六十。</p><p>因而淹禁致死者，若囚该死罪杖六十，流罪杖八十，徒罪杖一百，杖罪以下杖六十，徒一年。</p>
