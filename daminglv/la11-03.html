    <h1>致祭祀兴神祇</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>致祭祀兴神祇凡社稷、山门、风云、雷雨等神，及圣帝明王、忠臣烈士，载在祀典，应合致祭神祗，所在，有司置立牌面，开写神号，祭祀日期，于洁净处常川悬挂，依时致祭。至期失误祭祀者，杖一百。</p><p>其不当奉祀之神而致祭者，杖八十。</p>
