    <h1>擅勾属官</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>擅勾属官凡上司催会公事，立案定限，或遣牌，或差人行移所属衙门督并，如有迟错，依律论罪。</p><p>若擅勾属官拘唤吏典听事，及差占推官、司狱，各州县首领官，因而妨废公务者，笞四十。若属官承顺逢迎，及差拨吏典赴上司听事者，罪如之。其有必合追对刑名，查勘钱粮、监督造作重事，方许勾问，事毕随即发落。无故稽留，三者笞二十，每三日加一等，罪止笞五十。</p>
