    <h1>申报军务</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>申报军务凡将帅参随总兵官征进，如总兵官分调攻取城寨，克平之后，随将捷音差人飞报，一申总兵官，一申五军都督府，一行兵部，另具奏本，实封御前。</p><p>夏若赋人数多，出涛不常，如所领军人不敷，须要速申总兵官，添发军马，设策勦捕，不速飞申者，从总治罪。○若有来降之人，即便送赴总兵官，转报朝廷区处。其贪妇来降人财物，因而杀伤人，及中途逼勒逃窜者，斩。</p>
