    <h1>应议者之祖父有犯</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>应议者之祖父有犯凡应八议者，之祖父母、父母、妻及子孙犯罪，实封奏闻取旨，不许擅自分问。若奉旨推问者，开具所犯及应议之状，先奏请议，议定奏闻，取自上裁。口若皇亲、国戚及功臣之外祖父母、伯叔父毋、姑兄弟、姊妹、女壻兄弟之子若四之父母、妻及应合袭荫子孙犯罪，从有司依律追。其承两节议者，袒贯须问，议拟奏闻，取自上裁。</p><p>○其犯十恶、反逆、缘坐及奸盗、杀人、受财、枉法、此势虐害良民，凌犯官府者，加常人。犯人不在。若各衙门追问之际，封奏闻区处唊官。</p>
