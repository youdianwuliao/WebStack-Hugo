    <h1>与囚金刃解脱</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>与囚金刃解脱凡狱卒以金刃及他物可以自杀及解脱枷锁之具而与囚者，杖一百；因而致囚在逃及自伤或伤人者，并杖六十，徒一年。若囚自杀者，杖八十，徒二年；致囚歹狱及杀人者绞。其四在逃未断之间，能自捕得及他人捕得，若四已死及自首者，各减一等。</p><p>诸若常人以可解脱之物与人，及子孙与祖父母、父母，奴婢、雇工人与家长䎞，各减一等。人若司狱官典及提牢官知而不举者，与同罪。至死者减一等。若受财者，计赃以枉法从重论。</p><p>○若狱囚失于点检，致囚自尽者，狱卒杖六十，司狱官典各笞五十，提牢官笞四十。</p>
