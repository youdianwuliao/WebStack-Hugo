    <h1>谋杀祖父母父母</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>谋杀祖父母父母凡谋杀祖父母父母及期亲尊长、外祖父母、夫夫之祖父母父母，已行者皆软，已杀者皆凌迟处死。谋杀缌麻以上尊长，已行者杖一百，流二千里；已伤者绞，已杀者皆斩。○𩞤谛其尊长谋杀卑幼，已行者，各依故杀罪减二等，已伤者减一等，已杀者依故杀法。若奴婢及雇工人谋杀家长及家长之期亲外祖父母若缌麻以上亲者，罪与子孙同。</p>
