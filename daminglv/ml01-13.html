    <h1>工乐户及妇人犯罪</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>工乐户及妇人犯罪凡工匠、乐户犯流罪者，三流并决杖一百，留住，拗役四年。若钦天监天文生习业已成，能专其事。犯流及徒者，各决杖一百，余罪收赎。其妇人犯罪应决杖者，奸罪去衣受刑，余罪收赎。</p>
