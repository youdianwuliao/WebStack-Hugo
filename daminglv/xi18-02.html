    <h1>谋叛</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>谋叛凡谋叛，但共谋者，不分首从，皆斩。妻妾、子女给付功臣之家为奴，财产并入官。父母、祖孙、兄弟不限籍之同异，皆流二千里安置。知情故纵隐藏者绞。有能告捕者，将犯人财产全给充赏。知而不首者，杖一百，流三千里。若谋而未行，为杖一百，流三千里；知而不首者，杖一百，徒三年。○若逃避山泽，不服追唤者，以谋叛未行论。其拒敌官兵者，以谋叛已行论。</p>
