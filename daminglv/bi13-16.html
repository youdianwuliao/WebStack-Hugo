    <div class="article-body">
<p>门禁锁钥凡各处城门应闭而误不下锁者，杖八十；非时擅开闭者，为杖一百。京城门各加二速。非时开闭者，不在此限。</p><p>人若皇城门应闭而误不下锁者，杖一百，发边远。</p><p>充军，非时擅开闭者绞，其有旨开闭者勿论。</p>
