    <h1>立嫡子违法</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>立嫡子违法凡立嫡子违法者，杖八十。其嫡妻年五十以上无子者，得立庶长子，不立长子者，罪亦同。</p><p>○若养同宗之人为子，所养父母无子而舍去者，杖一百，发付所养父母收管。若有亲生子及本生父母无子，欲还者，听。</p><p>○其乞养异姓义子以乱宗族者，杖六十。若以子与异姓人为嗣者，罪同其子归宗。○其遗弃小其姓〇。若立嗣虽系同宗，而尊卑失序者，罪亦如之，其子亦归宗，改立应继之人。〇。</p><p>若庶民之家存养奴婢者，杖一。</p>
