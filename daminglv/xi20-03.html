    <h1>宫内忿争</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>宫内忿争凡于宫内忿争者，笞五十。声彻御在所，及相殴者，杖一百。折伤以上，加凡斗伤二等，殿内又递加一等。皇家袒免以上亲被殴，凡皇家袒免亲而殴之者，杖六十，徒一年；伤者杖八十，徒二年。折伤以上重者，加凡斗二等，缌麻以上各递加一等。</p><p>笃疾者绞，死者斩。</p>
