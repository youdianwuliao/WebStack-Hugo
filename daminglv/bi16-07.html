    <h1>畜产咬踢人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>畜产咬踢人凡马牛及犬有触抵踢咬人，而记号、拴系不如法，若有狂犬不杀者，笞四十。</p><p>因而杀伤人者，以过失论。若故放令杀伤人者，减斗杀伤一等百。其受雇医疗畜产，及无故触之而被杀伤者，不坐罪。○若故放术令杀伤他人畜产者，各笞四十，追陪所减价钱。</p>
