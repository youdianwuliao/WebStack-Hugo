    <h1>关防内使出入</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>关防内使出入凡内使监官并奉御内使，但遇出外，各门官须要收留本人在身，关防牌面，于簿上印记姓名字号明白，附写前去某处干办是何事务。其门官与守卫官军搜检沿身别无夹带，方许放出。回还，一体校检，给牌入内，以凭逐月𮃛考出外次数。但校出应干杂药，就令自吃。若不服按检者，杖一百充军。若非奉旨，私将兵器进入皇城门内者，杖一百，发边远充军；入宫殿门内者绞。门官及守卫官失于按检者，与犯人同罪。</p>
