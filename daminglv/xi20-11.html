    <h1>良贱相殴</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>良贱相殴凡奴婢殴良人者，加凡人一等，至笃疾者绞，死者斩。其良人殴伤他人奴婢者，减凡人一等。若死及故杀者绞。若奴婢自相殴伤杀者，各依凡斗伤杀法。相侵财物者，不用此律。若殴缌麻小功亲奴婢，非折伤勿论，至折伤以上，各减杀伤凡人奴婢罪二等，大功减三等，至死者杖一百，徒三年；故杀者绞，过失杀者，各勿论。</p><p>○若殴缌麻小功亲、雇工人，非折伤勿论，至折伤以上，各减凡人罪一等，大功减。</p><p>二等，至死及故杀者并绞，过失杀者，各勿论。</p>
