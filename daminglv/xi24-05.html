    <h1>禾铸铜钱</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>禾铸铜钱凡私铸铜钱者绞，匠人罪同，为从及知情买使者，各减一等。告捕者，官给赏银五十两，里长知而不首者，杖一百，不知者不坐。</p><p>○若将时用铜钱剪错薄小，取铜以求刹者，杖一百〇。</p><p>若伪造金银者，杖一百，徒三年。为从及知情买使者，各减一等。</p>
