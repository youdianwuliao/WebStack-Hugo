    <h1>知情藏匿罪人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>知情藏匿罪人凡知人犯罪事发，官司差人追唤，而藏匿在家，不行捕告，及指引道路，资给衣粮，送令隐避者，各减罪人罪一等。其展转相送而隐藏罪人，知情者皆坐，不知者勿论。○若知官司追捕罪人而漏泄其事，致令罪人得以逃避者，减罪人罪一等。之间，能自捕得者免罪，若他人捕得及罪死。</p>
