    <h1>嫁娶违律主婚媒人罪</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>嫁娶违律主婚媒人罪凡嫁娶违律，若由祖父母、父母、伯叔父母、姑兄姊及外祖父母主婚者，独坐主婚。余亲主婚者，事由主婚，主婚为首，男女为从，事由男女，男如为首婚，为婚女被主婚人威逼，事不由己。若男年二十岁以下及在室之女独婚，男女俱不坐○未成婚者，各减已成婚罪五等。〇若媒人知情者，各减犯人罪一等，不知者不坐○其违律为婚，各条称离异改正者，虽会赦犹离异改正。离异者，妇女并归宗。○财礼若娶者知情则追入官，不知者则追还主。</p>
