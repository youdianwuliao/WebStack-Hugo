    <h1>诈假官</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>诈假官凡诈假官、假与人官者斩。其知情受假官者，杖一百，流三千里；不知者不坐。○若无官而诈称有官，有所求为，或诈称官司差遣而捕人及诈冒官员姓名者，杖一百，徒三年。若诈称见任侄家人总领，于按临部内有所求为者，杖一百，为从者各减二等。若得财者，并计贼准窃盗从重论。○其当唊知而听行，与。</p>
