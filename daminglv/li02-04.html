    <h1>滥设官吏</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>滥设官吏凡内外各衙门官有额定员数而多余添设者，当该官吏一人杖一百，每三人加一等，罪止杖一百，徒三年。○若吏典、知印、承差、祇候、禁子、亏兵人等，额外滥充者，杖一百。迁徙容留一人，正官笞二十，首领官笞三十，吏笞四十，每三人各加一等，并罪止杖一百，罪坐所由。○其罢闲官吏在外干预官事，结揽写发文案，把持官府，蠹政害昏者，并杖八十，于犯人名下追银二十两，付告人充赏，仍于门首书写过名三年，不犯，官为除去，再犯加二等。迁徙有所规避者，从重论人。若税粮由帖、户口籍雇募攒写者，勿论。</p>
