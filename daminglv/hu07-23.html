    <h1>隐瞒入官家产</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>隐瞒入官家产凡抄没人口财产，除谋反、谋叛及奸党系在十恶，依律抄没，其余有犯律不该载者，妻子财产，不在抄没入官之限。违者依故入人流。</p><p>不报者，计口以隐漏丁口论。若隐漏田土者，计田以欺隐田粮论。若隐瞒财物、房屋、孳畜者，坐赃论，各罪止杖一百。所隐人口财产并入官，罪坐供报之人。○若里长同情隐瞒，及当该言吏知情者，并与同罪。计所隐赃重者，坐贼论，全科。受财者，计贼以枉法，各从重论。失觉举者减三等，罪止笞五十。</p>
