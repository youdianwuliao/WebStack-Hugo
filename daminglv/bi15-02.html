    <h1>诈冒给路引</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>诈冒给路引凡不应给路引之人而给引，及军诈为民，民诈为军。若冒名告给引，及以所给引转与他人者，并杖八十。若于经过官司停止去处，倒给路别，及官豪势要之人，嘱托军民衙门，檀给批帖，影射出人者，各杖一百。当该官吏听从及知情给与者，并从及不知者不坐。
○若巡检司越分给引者，罪亦如之。○其不立久案，空押路引私填与人者，杖一百，徒三年。○受财者，计贼以枉法，及有所规避者，各从重论。○若军民出百里之外，不给引者，军以逃军论，民以私度关津论。</p>
