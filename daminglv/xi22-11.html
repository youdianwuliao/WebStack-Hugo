    <div class="article-body">
<p>诬告充军及迁徙备毂惊全诬不凡诬告充军者，民告，抵充军役，军告，发边远充军。</p><p>○若官吏故将平人顶替他人军役者，以故出入人流论，杖一百，流三千里。</p><p>○若诬告人说事过钱者，于迁徙比流减半，准徒二年上，茄所诬罪三等，并入所得笞杖通论。</p>
