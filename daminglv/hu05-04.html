    <h1>盗卖田宅</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>盗卖田宅凡盗卖换易及冒认若虚钱实契典买及侵占他人田宅者，田一亩、屋一间以下笞五十；每田五亩、屋三间，加一等，罪徒二年。系官者各加二等。</p><p>夏。若强占官民山场、湖泊、茶园、芦荡及金银、铜场、铁冶者，杖一百，流三千里。○若将互争及他人田产妄作己业，朦胧投献官豪、势要之人，与者、受者各杖一百，徒三年。○田产及盗卖过田价，并递年所得花利，各还官给主。○若功臣初犯免罪附过，再犯住支俸给一半，三犯全不支给，四犯与庶人同罪。</p>
