    <h1>宫殿门擅入</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>宫殿门擅入凡擅入皇城午门、东华、西华、玄武门及禁苑者，各杖一百。擅入宫殿门，杖六十，徒一年。擅入御膳所及御在所者绞，未过门限者，各减一等。〇若无门籍冒名而入者，罪亦如之。〇。其应入宫殿，未著门籍而入，或当下直而辄入，及宿次未到而辄宿者，各笞四十。○若不系宿卫应直合带兵仗之人，但持寸刃入宫殿门内者绞，入皇城门内者，杖一百，发边远充军。</p><p>○门及宿卫官军故纵者，各与犯人罪。失觉察者减三等，罪止杖一百；军人又减一等，并罪坐直曰者。</p>
