    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>信牌凡府州县置立信牌，量地远近，定立程限，随事销缴。违者一日笞一十，每一曰加一等，罪止笞四十。〇。若府州县官遇有催办事务，不行依律发遣，信牌辄下所属守并者，杖一百。其官点视桥梁、圩岸。</p><p>禁辱限</p><p>传递铺、踏勘灾伤、检尸、捕贼、抄札之类，不在此限。</p>
