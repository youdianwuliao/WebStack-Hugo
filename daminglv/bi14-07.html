    <h1>军人替役</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>军人替役凡军人不亲出征，雇倩人冒名代替者，替身杖八十，收籍充军；正身杖一百，依旧充军。若守御军人雇久冒名代替者，各减二等。其子孙弟侄及愿代替者听。若果有老弱残疾，赴本管官司陈告，验实，与免军身。○若医工承差关领官药，随军征进，转雇庸医冒名代替者，各杖八十，雇工钱入官。</p>
