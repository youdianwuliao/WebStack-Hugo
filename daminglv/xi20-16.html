    <h1>殴期亲尊长</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>殴期亲尊长凡弟妹殴兄姊者，杖九十，徒二年半；伤者杖一百，徒三年；折伤者杖一百，流三千里；刃伤及折肢若瞎其一目者绞，死者皆斩。若侄殴伯叔父毋、姑及外孙欧外祖父母，各加一等。其过失杀伤者，各减本杀伤罪二等，故杀者皆凌迟处死。其兄姊殴杀弟妹及伯叔姑殴杀侄并侄孙，若外祖父母殴杀外孙者，杖一百，徒三年；故杀者杖一百，流二千里；过失杀者，各勿论。</p>
