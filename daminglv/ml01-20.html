    <h1>同僚犯公罪</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>同僚犯公罪凡同僚犯公罪者，并以吏典为首，首领官减吏典一等，佐贰官减首领官一等，长官减佐贰官一等。○若同僚官一人有私，自依故出入人罪论，其余不知情者，止依失出入人罪论。</p><p>若申上司不觉，失错准行者，各递减下司官吏罪二等之类。若上司行下所属，依错施行者，各递减上司官吏罪三等，各以吏典为首。</p>
