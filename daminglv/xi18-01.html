    <h1>贼盗谋反大逆</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>贼盗谋反大逆凡谋反及大逆，但共谋者，不分首从，皆凌迟处死。祖父父人不分异姓及伯叔处。兄弟之子，不限籍之同异。</p><p>年十六以上，不论笃疾、废疾，皆软。其十五以下及母女、妻妾、姊妹若子之妻妾，给付功臣之家为奴，财产入官。若女许嫁已定，归其夫，子孙过房与人，及聘妻未成者，俱不追坐。知情故纵隐藏者斩。捕获者，民授以民官，军产全给充赏。知而首告，官为捕获者，止给财产。不首者，杖一百，流三千里。</p>
