    <h1>主守不觉失囚</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>主守不觉失囚凡狱卒不觉失囚者，减囚罪二等。若囚自内反狱，在逃又减二等。听给限一百曰追捕，限内能自捕得及他人捕得，若囚已死及皆免。狱典减狱卒罪三等。其提牢官曾经躬亲逐一点视罪囚枷锁杽，俱以如法取责。狱官、狱卒牢固收禁久状者不坐。若不曾点视，以致失囚者，与狱官罪同。故纵者，不给捕限，各与囚同罪。未断之间，能自捕得及他人捕得，若囚已死及自首，各减一等。受财者，计𡚥以枉法从重论。可。若贼自外入劫，囚力不能敌者，免罪可。若押解罪囚，中途不觉失囚者，罪亦如之。</p>
