    <h1>邀取实封公久</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>邀取实封公久凡在外大小各衙门官，但有入递进呈实封公久至御前，而上司官令人于中途急递铺邀截取回者，不拘远近，从本铺铺司铺兵赴所在官司告举，随即申呈上司，转达咏部，追究得实，斩。其铺司、铺兵容隐不告举者，各杖一百。若已告举而所在官司不即受理施行者，罪亦如之。○若邀。</p>
