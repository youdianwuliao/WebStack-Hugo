    <h1>典雇妻文</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>典雇妻文凡将妻妾受财典雇与人为妻妾者，杖八十；典雇女者，杖六十，妇女不坐。○若将妻妾妄作姊妹嫁人者，杖一百，妻妾杖八十。</p><p>○知而典娶者，各与同罪，并离异，财礼入官，不知者不坐，追还财礼。</p>
