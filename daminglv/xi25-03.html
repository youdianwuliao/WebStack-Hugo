    <h1>亲属相奸</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>亲属相奸凡奸𠖄宗无服之亲及无服亲之妻者，各杖一百。○若奸缌麻以上亲及缌麻以上亲之妻，若妻前夫之女及同母异父姊妹者，各杖一百，徒三年。强者斩。若奸从祖祖母、姑、从祖伯叔母、姑、从父姊妹、母之姊妹及兄弟妻、兄弟子妻，诸各绞，强者斩。若奸父祖妾伯叔母、姑、姊妹、子之女者，各斩。○。</p>
