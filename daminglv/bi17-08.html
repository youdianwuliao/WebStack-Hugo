    <h1>公事应行𮃛程</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>公事应行𮃛程凡公事有应起解官物、囚徒畜产，差人管送，而辄稽留，及事有期限而违者，一曰笞二十，每三日加一等，罪止笞五十。若起解军需、随征供给，而管送违限者，各加二等，罪止杖一百。以致临敌缺乏，失误军机者斩。</p><p>若承差人误，不依题写去处，错去他所，以致违限者，减二等。事未军务者，不减。若由公文题写错者，题写之人、承差人不坐。</p>
