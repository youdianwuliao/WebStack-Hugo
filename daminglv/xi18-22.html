    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>公取窃取皆为盗凡盗公取器物钱帛之类，须移徙已离盗所，珠玉宝货之类，据入手隐藏，纵未将行，亦是其木石所胜，虽移本处，未驼载间，犹未成盗。马牛、驼赢之类，须出阑圈；鹰术之类，须专制在己，乃成为。</p>
