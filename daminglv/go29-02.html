    <h1>造作不如法</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>造作不如法凡造作不如法者，笞四十。若成造军器不如法，及织造段疋粗糙，毗所损财物及所费雇工钱重者，坐贼论。
其应供奉御用之物，加二等，工匠各以所由为罪。局官减王匠一等，人提调官吏又减局官一等，并均偿物价、工钱还官。</p>
