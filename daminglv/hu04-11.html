    <h1>逃避差役</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>逃避差役凡民户逃住邻境州县，躱避差役者，杖一百，发还原籍当差。其亲管里长、提调官吏故纵及邻境人户隐蔽在己者，各与同罪。若里长知而不逐遣，及元管官司不移仗起取，若移文起取，而所在官司占吝不发者，各杖六十。其在洪武七年十月以前，流移他郡，曾经附籍当差者，勿论。限外逃者，论如律。</p><p>○若丁夫、杂匠在役及工乐杂户逃者，一曰笞一十，每五日加一等。罪吏故纵者，各与同罪。受财者，计赃以枉法从重论。不觉逃者，五人笞二十，每五人加一等，罪止笞四十。不及五名者免罪。</p>
