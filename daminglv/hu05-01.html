    <h1>田宅欺隐田粮</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>田宅欺隐田粮凡欺隐田粮，脱漏版籍者，一亩至五亩笞一等，入官。所隐税粮依数征纳。澎。若将田土移近换段、那移等则，以高作下，减瞒粮额，及诡寄田粮，影射差役，并受寄者如之。其田改正收科当差。里长知而不举，与犯人同罪。○其还乡复业人民，丁力少而旧田多者，听从尽力耕种，报官入籍，计田纳粮当差。若多余占田而荒芜者，三亩至十亩笞三十，每十亩加一等，罪止杖八十，其田入官。若丁力多而旧田少者，告官于附近荒田内验力拨付耕种。</p>
