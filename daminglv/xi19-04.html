    <h1>采生拆割人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>采生拆割人凡采生拆割人者，凌迟处死，财产断付死者之家，妻子及同居家口，虽不知情，并流二千里安置；为从者斩。若已行而未曾伤久者亦斩。妻子从者，杖一百，流三千里。里长知而不举者，杖一百，不知者不坐。告获者官给赏银二十两。</p>
