    <h1>公式讲读律令一</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>公式讲读律令一凡国家律令，参酌事情轻重，定立罪名，颁行天下，永为遵守。百司官吏务要熟读，讲明律意，剖决事务。每遇年终，在内从察院，在外从分巡御史提型，按察司官按治去处考校。若有不能讲解，不晓律意者，初犯罚俸钱一月，再犯笞四十，附过三犯，于本衙门递降叙用。○其百工技艺人等，有能熟读讲解，通晓律意者，若犯过失，及因人连累。</p><p>致罪，不问轻重，并免一次。其事千谋歹逆叛者，不用此律。</p><p>○若官吏人等挟诈欺公，妄生异议，擅为更改，变乱成法者，斩。</p>
