    <h1>尊卑为婚</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>尊卑为婚凡外姻有服尊属卑幼共为婚姻，及娶同母异父姊妹若妻前夫之女者，各以奸论。〇。其父母之姑舅、两姨姊妹及姨母之姑堂姑、己之堂姨及再从姨堂外甥女若女壻及子孙妇之姊妹，并不得为婚姻。违者，各杖一百○若娶己之姑舅、两姨姊妹者，杖八十。○异。</p>
