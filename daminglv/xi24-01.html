    <h1>诈传诏旨</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>诈传诏旨凡诈传诏旨者斩。皇后懿旨、皇太子令旨、亲王令旨者绞。若谁传一品、二品衙门语，于各衙门分付公事，有所规避耇杖一百，徒三年。三品、四品衙门官言语者，杖一百；五品以下衙门官言语者，杖八十。为从者各减一等。若得财者，计贼以不枉法。因而动事曲法者，以枉法，各从重论。○其当该官司知而听行，各与同罪，不知者不坐。○若各衙门追究钱粮，鞫问刑名公事，当该官吏将奏准合行事理，妄称奉旨追问者，斩。</p>
