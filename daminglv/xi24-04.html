    <h1>伪造宝钞</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>伪造宝钞凡伪造宝钞，不分首从及窝主，若知情行使者，皆软财产并入官。告捕者，官给赏银二百五十两，仍给犯人财产。里长知而不首者，杖一百，不知者不坐。其巡捕守把官军知情故纵者，与搜获伪钞，隐匿入己，不解官者，杖一百，流三千里；失于巡捕及透漏者，杖八十，仍依强盗责限根捕。若将宝钞挑剜补辏描改，以真作伪者，杖一百，流三千里；为从及知情行使者，杖一百，徒三年。○其同情造伪人，有能悔过捕获，依常人一体给赏。</p>
