    <h1>防盗决河防</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>防盗决河防凡盗决河防者，杖一百；盗决圩岸陂塘者，杖八十。若毁害人家及漂失财物，渰没田禾，计物价重者，坐赃论。因而杀伤人者，各减斗杀伤。若故决河防者，杖一百，徒三年；故决玕岸陂塘，减二等。漂失赃重者，准窃盗论免。因而杀伤人者，各以故杀伤论。
失时不修隄防，凡不修河防及修而失时者，提调官吏各笞五十。若毁害人家，漂失财物者，杖六十；因而致伤人命者，杖八十。○若不修玕岸及修而失时者，笞三十；因而渰没田禾者，笞五十。○其暴水连雨，损坏隄防，非人力所致者，勿论。</p>
