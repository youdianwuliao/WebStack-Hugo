    <h1>从征违期</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>从征违期凡军官军人临当征讨已期而稽留不进者，一日杖七十，每三曰加二等。若故自伤残及诈为疾患之类，以避征役者，各加二等，并罪止杖一百，仍发出征。今若军境托故违期，一日不至者，杖一百；三曰不至者斩。若功赎罪者，从总兵官区处。</p>
