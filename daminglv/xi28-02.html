    <h1>故禁故勘平人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>故禁故勘平人几官吏怀挟私雠，故禁平人者，杖八十；因而致死者绞。提牢官及司狱官典、狱卒知而不举首者，与同罪，至死者减一等，不知者不坐。若因公事干连平人，在官无招误禁致死者，杖八十；有文案应禁者，勿论。</p><p>○若故勘平人者，杖八十；折伤以上，依凡斗伤论。因而致死者斩。同僚官及狱卒知情共勘者，与同罪，至死者减三等，不知情及依法拷讯者，不坐。若因公事莱连平人，在官事及罪人赃状，证佐明白，不服招承，明立文案，依法拷讯，邂逅致死者，勿论。</p>
