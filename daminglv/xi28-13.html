    <h1>狱四诬指平人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>狱四诬指平人凡四在禁诬指平人者，以诬告人论，其本犯罪重者，从重论。○若官吏鞫问狱四，非法拷讯，故行教令，诬指平人者，以故入人罪论。○若追征钱粮，逼令诬指平人代纳者，计所枉征财物坐赃论，其物给主。○其被诬之人无故稽留三日不放回者，笞二十，每三曰加二等，罪止杖六十。不若鞫囚，而证佐之人不言实情，故行诬证，及化外之人有罪，通事传译番语，不以实对，致罪有出入者，证佐人减罪人罪二等，通上事与同罪。</p>
