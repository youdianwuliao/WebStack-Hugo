    <h1>廐牧牧养畜产不如法</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>廐牧牧养畜产不如法凡牧养驼、蠃、驴、羊，并以一百头为率，若死者、损者、失者，各从实，皮张亦入官。其群头、群副，每三头各笞三十，每三头加一等，过杖一百，每十头加三等，罪止杖一百，徒三年。羊减马三等，驴嬴减马、牛、驼二等。若胎生不及曰时而死者，灰腌看视明白不坐。若失去陪偿，损伤不堪，甪减死者一等坐罪，其死损数目，并不准除。</p>
