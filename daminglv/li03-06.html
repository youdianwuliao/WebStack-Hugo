    <h1>出使不复命</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>出使不复命凡奉制敕出使，不复命，干预他事者，杖一百。各衙门出使不复命，千预他事者，常事杖七十；军情重事杖一百。若越理犯分，侵人职掌行事者，笞五十。</p><p>○若回还后三曰不缴圣旨者，杖六十；每二曰加一等，罪止杖一百。不缴纳符验者，笞四十，每三曰架一等，罪止杖八十。〇。若有所规避者，各从重论。</p>
