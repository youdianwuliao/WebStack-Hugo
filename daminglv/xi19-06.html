    <h1>夫殴死有</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>夫殴死有凡妻妾因殴骂夫之祖父母、父母，而夫擅杀死者，杖一百。○若夫殴骂妻妾，因而自尽身死者，勿论。杀子孙及奴娜图赖人凡祖父母、父母故杀子孙及家长故杀奴婢，图赖人者，杖七十，徒一年半。人将家长身尸图赖人者，杖一百，徒三年；期亲尊长杖八十，徒二年，大功、小功缌麻各递减一等。
夏。若尊长将已死卑幼及他人身尸图赖人者，杖八十〇。其告官者，随所告轻重，并依诬告平人律论罪。若因而诈取财物者，计贼准窃盗论；抢去财物者，准白昼抢夺论，免刺，各从重科断。</p>
