    <div class="article-body">
<p>宫殿造作罢不出凡在宫殿内造作，所司具工作姓名报门官及守卫官，就于所父门首逐一点视，放入工作。至申时分，仍须相视形貌，照数点出。其不出者绞。监工及提调内使监官、门官、守卫官军点视，如名数短少，就便按捉，随即奏闻。</p><p>知而不举者，与犯人同罪。失觉察者减三等，罪止杖一百。</p>
