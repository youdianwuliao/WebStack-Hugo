    <h1>犯罪共逃</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>犯罪共逃凡犯罪共逃亡，其轻罪囚能捕获重罪囚而首告，及轻重罪相等，但获一半以上，首告者一人。</p><p>其因人连累致罪而罪人自死者，听减本罪二等。若罪人自首告，及遇赦原免，或蒙特人原免，减等赎罪法。</p>
