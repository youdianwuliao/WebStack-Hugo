    <h1>亲属相为容隐</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>亲属相为容隐凡同居，若大功以上亲及外祖父母、外孙妻之父、世女壻若孙之妇、夫之兄弟及兄弟妻有罪，相为容隐。奴婢、雇工人为家长隐者，皆勿论。若漏泄其事及通报消息，致令罪人隐匿逃避者，亦不坐。其小功以下相容隐及漏泄其事者，减犯人三等，无服之亲减一等。若犯谋叛以上者，不用此律。</p>
