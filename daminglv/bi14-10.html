    <h1>不操练军主</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>不操练军主凡各处守御官不守纪律，不操练军士，及城池不完，衣甲器仗不整者，初犯杖八十，附过还职；再犯杖一百。指挥使降充同知，同知降充佥事，佥事降充许户，千户降充百户，百户降充总旗，总旗降充小旗，小旗降充军役，并发边远守御。○若隄备不严，抚驭无方，致有所部军人反叛，诸亲管指挥、千户、百户、镇抚，各杖一百，追夺，发边远充军。若弃城而逃者，斩。</p>
