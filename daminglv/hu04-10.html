    <h1>禁革主保里长</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>禁革主保里长凡各处人民，每一百户内议设里长一名，甲首一十名，轮年应役，催办钱粮，勾摄公事。若有妄称主保、小里长、保长、主首等项名色，生事扰民者，杖一百，迁徙口。其合设耆老，须于本乡年高有德、众所推服人内选充，不许罢闲吏卒及人充应。违者杖六十，当该官吏笞四十。</p>
