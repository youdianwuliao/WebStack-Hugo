    <h1>依告状鞫狱</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>依告状鞫狱凡鞫狱，须依所告本状推问，若于状外别求他事，摭拾人罪。</p><p>诸以故入人罪论，同僚不署久案者，不坐。</p><p>○若因其告状，或应掩捕搜检，因而捡得别罪，事合推理者，不在此限。</p><p>原告人事毕不放回。</p><p>凡告词讼，对问得实，被告已招服罪，元告人别无待对事理，随即放回。若无故稽留，三曰不放者，笞二十，每三曰加一等，罪止笞四十。</p>
