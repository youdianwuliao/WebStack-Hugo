    <h1>人追捕罪人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>人追捕罪人凡应捕人承差追捕罪人，而推故不行，若知罪人所在而不捕者，减罪人罪一等，限三十曰内捕得一，虽不及一半，但所若罪人已死及自首，各尽者亦免罪。不尽者，止以不整光辅尽之人为坐。其非应捕人临时差遣者，各减应捕人罪一等。受财故纵者，不给捕限，各与囚同罪。贼重者，计贼以枉法从重论。</p>
