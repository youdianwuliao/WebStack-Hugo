    <h1>多乘驿马</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>多乘驿马凡出使人员，应乘驿船、驿马数外，多乘二船一马者，杖八十；每一船一马加一等。若应乘驴而乘马，及应乘中等下等马而勒要上等马者，杖七十。因而殴伤驿官者，各加一等。若驿容情应付者，各减犯人罪一等。其应乘上等马而驿官却与中等下等马者，罪坐驿官，本驿如无上等马者，勿论。○若枉道驰驿，及经驿不换船马者，杖六十。因而走死驿马者，加一等，追偿马匹还官。○其事非警急，不曾枉道而走死驿马者，偿而不坐。○若军情警急，及前驿无船马倒换者，不坐不偿。</p>
