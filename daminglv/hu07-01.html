    <h1>仓库钞法</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>仓库钞法凡印造宝钞，与洪武大中通宝及历代铜钱相兼行使，其民间买卖诸物，及茶盐商税、诸邑课程，并听收受。违者杖袅等，丕一百。若诸人将宝钞赴仓场库务折纳诸色课程，中卖盐货，及各衙门起解贼罚，须要于钞背用使，姓名私记，以凭稽考。若有不行用心辨验，收受伪钞，及挑剜描辏钞贯在内者，经手之人杖一百，倍追所纳钞贯钞一，伪挑钞贯，烧毁。其民间关市交易记。若有不行子细辨验，误相行使，诸杖一百，倍追钞贯，止问见使之人。若知情行使者，并依本律。</p>
