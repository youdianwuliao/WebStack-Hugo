    <h1>飞报军情</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>飞报军情凡飞报军情，在外府州差人，一申布政司，一申都指挥使司，及行移本道按察司。其守御官差人行移都指挥使司，都指挥使司差人，一行本管都督府，一具实封。布政司大差人行移兵部，一具实封，俱至御前开拆。按察司差人具实封直奏。在内直隶军民官司，并差人申本管都督府及兵部，另具实封，各奏闻。</p><p>若互相知会，隐匿不速奏闻者，杖一百，罢职不叙。</p><p>因而失误军机者，斩。</p>
