    <h1>亵渎神明</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>亵渎神明凡私家告天拜十，焚烧夜香，燃点天灯、七灯，亵渎神明者，杖八十。妇女有犯，罪坐家长。若僧道修斋设𬋕，而拜奏青词、表文及祈禳火灾者，同罪还俗。</p><p>若有官及军民之家，纵令妻女于寺观神庙烧香者，笞四十，罪坐夫男；无夫男者，罪坐本妇。其寺观神庙住持及守门之人不为禁止者，与同罪。</p>
