    <h1>孳生马匹</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>孳生马匹凡群头管领骒马一百匹为一群，每年孳生驹一百匹。若一年之内止有驹八十匹者，笞五十；七十匹者杖六十。都群所官不为用心提调者，各减三等。太仆又所官罪二等。</p><p>一、验畜产不以实。</p><p>凡相验分拣官马、牛、驼、赢驴不以实者，一头笞四十，每三头加一，杖一百。验羊不以实，减三等。若因而价有增减者，计所增减价坐赃论，入己者以监守自盗论，各从重科断。</p>
