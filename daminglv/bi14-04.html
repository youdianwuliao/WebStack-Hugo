    <div class="article-body">
<p>边境申索军需凡守边将帅，但有取索军器、钱粮等物，须要差人一行布政司，一行都指挥使，人一行五军都督府，一行合干部分，及具奏本实封御前。其公文若到，该部，五军都督府，须要随即奏闻区处，发遣差来人回还。</p><p>若稽缓不即奏闻，及各处不行依式申报者，并杖一百，罢职不叙。因而失误军机者斩。</p>
