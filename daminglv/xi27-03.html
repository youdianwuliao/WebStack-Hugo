    <h1>稽留囚徒</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>稽留囚徒凡应徒、流、迁徙、充军囚徒，断决后，当该官司限一十曰内如法枷杽，差人管押，牢固关防，发遣所拟地方交割。若限外无故稽留不送者，三加一等，罪止杖。吏抵犯人本罪发遣，候捕获犯人到官替役。至曰疏放别叙。若邻境官司囚到，稽留不即递送者，罪亦如之。〇。若发遣之时，提调官吏不行如法枷杽，以致囚徒中途解脱，自带敕杽在逃者，与押解人同罪。七并罪坐所由。受财者，计贼以枉法从重论。</p>
