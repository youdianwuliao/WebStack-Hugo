    <h1>仪制合和御药</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>仪制合和御药凡合和御药，误不依本方及封题错误，医人杖一百；料拣择不精者，杖六十。若造御膳，误犯食禁，厨子杖一百。若饮食之物不洁净者，杖八十；拣择不精者，杖六十；不品尝者笞五十。监临、提调官各减医人、厨子罪二等。○若监临、提调官及厨子人等，误将杂药至造御膳处所者，杖一百；所将杂药就令自吃。门官及守卫官失于按检者，与犯人同罪，并临时奏闻区处。</p>
