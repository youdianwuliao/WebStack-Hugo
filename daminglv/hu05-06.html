    <h1>典买田宅</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>典买田宅凡典买田宅，不棁契者，笞五十，仍追田宅价钱一半入官。不过割者，一亩至五亩笞四十，每五亩加一等，罪止杖一百，其田入官。</p><p>○若将己典卖与人田宅，朦胧重复典卖者，以所得价钱计贼，准窃盗论，免刺，追价还主。田宅从元典买主为业。若重复典买之人及牙保知情者，与犯人同罪，追价入官，不知者不坐。〇。</p><p>其所典田宅、园林、碾磨等物，年限已满，业主备价取赎。若典主托故不肯放赎者，笞四十。限外递年所得花利，追徵给主，依价取赎。其年限虽满，业主无力取赎者，不物此律。</p>
