    <h1>失火</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>失火凡失火烧自己房屋者，笞四十；延烧官民房屋者，笞五十。因而致伤人命者，杖一百，罪坐失火之人。若延烧宗庙及宫阙者绞，〇社减二等○若于山陵兆域内失火者，杖八十，徒二年。延烧林木者，杖一百，流二千里。若于官府公廨及仓库内失火者，亦杖八十，徒二年。主守之人因而侵欺财物者，计赃以监守自盗论。其在外失火而延烧者，各减三等。○若于库藏及仓廒内燃火者，杖八十。○其守卫宫殿及仓库若掌，杖一百。</p>
