    <h1>妻妾与夫亲属相殴</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>妻妾与夫亲属相殴凡妻妾殴夫之期亲以下、缌麻以上獦长，与殴杀夫之兄弟子，杖一百，流三千里，故杀者绞。妾犯者，各从凡斗法可。若尊长殴伤卑幼之妇，减凡人一等，妾又减一等，至死者绞。</p><p>○若弟妹殴兄之妻，加凡人一等百。若兄姊殴弟之妻，及妻殴夫之弟妹及弟之妻，各减凡人一等。若殴妾者，各又减一等人。其殴姊妹夫、妻之兄弟及妻殴夫之姊妹夫者，以凡斗论。若妾犯者，各加一等百。若妾殴夫之妾子，减凡人二等，殴妻之子，以凡人论。若妻之子殴伤父妾，加凡人一等，妾子殴伤父妾，又加死者各。</p>
