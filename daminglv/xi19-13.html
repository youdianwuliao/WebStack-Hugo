    <h1>尊长为人杀私稍</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>尊长为人杀私稍凡祖父母父母及夫若家长为人所杀，而子孙、妻妾、奴裨、雇工人私和者，杖一百，徒三年。期亲尊长被杀而甲幼私和者，杖八十，徒二年，大功以下各递减一等。其卑幼被杀而尊长私和者，各减二等。若妻妾、子孙及子孙之妇、奴娜、雇工人被杀，而祖父母父母夫、家长私和者，杖八十。
受财者，计贼准窃盗论，从重科断。○常人私和人命䎞，杖六十。</p>
