    <h1>造作过限</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>造作过限凡各处额造常课段疋、军器，过限不纳齐足者，以十分为率，一分工匠笞二十；每一分加二一等，罪止笞五十。局官减工匠一等，提调官吏又减局官一等。〇。若不依期计拨物料者，局官笞四十，提调官吏减一等。一、修理仓库，凡各处公廨、仓库、局院系官房舍，但有损坏，当该官吏随即移文有司修理，违者笞四十。若因而损坏官物者，依律科罪，陪偿所损之物。若已移文有司，而失误者，罪坐有司。有司官吏不住公廨。凡有司官吏不住公廨内官房，而住街市民房者，杖八十。若埋没公用器物者，以毁失官物论。</p>
