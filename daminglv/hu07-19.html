    <h1>损坏仓库财物</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>损坏仓库财物凡仓库及积聚财物，主守之人安置不如法，瞫䀶不以时，致有损坏，诸计所损壤之物坐赃论，着落均陪还官。可。若卒遇雨水冲激，失火延烧、盗贼劫夺不测而有损失者，委官保勘覆实，显迹明白，免罪不陪。其监临主守若将侵欺借贷那移之数，乘其水火盗贼虚凰文案及扣换交单，籍𠕁申报瞒官者，并计贼以监守自盗论。同僚知而不举者，与同罪，不知者不坐。</p>
