    <h1>狱囚衣粮</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>狱囚衣粮凡狱囚应请给衣粮、医药而不请给，患病，应脱去枷锁杽而不脱去，应保管出外而不保管，应听家人八视而不听司狱典、狱卒笞五十。因而致死者，若囚该死罪杖六十，流罪杖八十，徒罪杖一百，杖罪以下杖六十，徒一年。提牢官知而不举者，与同罪。○若上司不即施行者，一曰笞一十，每二曰加一等，罪止笞四十。因而致死者，若囚该死罪杖六十，流罪杖八十，徒罪杖一百，杖罪以下杖六十，徒一年。</p>
