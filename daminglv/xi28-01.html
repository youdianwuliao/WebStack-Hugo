    <h1>断狱囚应禁而不禁</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>断狱囚应禁而不禁凡狱囚应禁而不禁，应枷锁枉而不柳锁杽及脱去者，若囚该杖罪笞三十，徒罪笞四十，流罪笞五十，死罪杖六十。若应枷而锁、应锁而枷者，各减二等。○若囚自脱去，及司狱官典、狱卒私与囚脱去枷锁、𣒌者，罪亦如之。提牢官知而不举者，与同罪，不知者不坐。○其不应禁而禁，及不应枷锁杽而枷锁枉者，各杖六十。○若受财者，并计贼以枉法从重论。</p>
