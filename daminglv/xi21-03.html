    <h1>佐职统属骂长官</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>佐职统属骂长官凡首领官及统属官骂五，杖八十。若骂六品以下长官，减三等。佐贰官骂长官者，又各减二等。奴婢骂家长凡奴婢骂家长者绞。</p><p>骂家长之期亲及外祖父母者，杖八十，徒二年，大功杖八十，小功杖七十，缌麻杖六十。若雇工人骂家长者，杖八十，徒二年。</p><p>骂家长之期亲及外祖父母者，杖一百，大功杖六十，小功笞五十，缌麻笞四十。骂尊长。</p><p>凡骂缌麻兄姊，笞五十，小功杖六十，大功杖七十，尊属各一等。若骂兄姊，耇杖一百，伯叔父兮姑外祖父母各。</p>
