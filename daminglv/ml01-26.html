    <h1>处决叛军</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>处决叛军凡边境城池，若有军人谋叛，守御官捕获到官，显迹证佐明白，鞫问招承，行移都指挥使司，委官审问无冤，随即依律处治，具由申达五军都督府，奏闻知会。若有布政司、按察司去处，公同审问处治。如在军前临阵擒杀者，不在此限。</p>
