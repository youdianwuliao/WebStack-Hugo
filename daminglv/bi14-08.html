    <h1>主将不固守</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>主将不固守凡守边将帅，被贼攻围城寨，不行固守而辄弃去，及守备不设，为贼所掩袭，因而失陷城寨者斩。若与贼临境，其望高巡哨之人失报，以致陷城损军者，亦斩。若被贼侵入境内，虏掠人民者，杖一百，发边远充军。○其官军临阵先退，及围困敌城而逃者，斩。</p>
