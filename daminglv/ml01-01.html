<p>职官有犯凡京官及在外五品以上官有犯，奏闻请旨，不许擅问。六品以下，听分巡御史、按察司并分司取问明白议拟闻奏区处。○若府、州县官犯罪，所辖上司不得擅自勾问，止许开具所犯事由，实封奏闻。若许准推问，依律议拟奏候委官审实，方许判决。其犯应该笞决、罚俸收赎、纪录者，不在奏请之限。〇。若所属官被本管上司非理凌虐，亦听开具实迹、实封，径直奏陈。</p>
