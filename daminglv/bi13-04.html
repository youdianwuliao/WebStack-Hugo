    <h1>从驾稽违</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>从驾稽违凡应从车驾之人，违期不到，及从而先回还者，一日十，每三曰加一等，罪止杖一百；百户以上各加一等。〇若萨从车驾行而逃者，杖一百，发边远充军，百户以上绞。〇亲故纵者，各与犯人同罪。失觉察者减三等，罪止杖一百。</p>
