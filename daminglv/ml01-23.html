    <h1>犯罪事发在逃</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>犯罪事发在逃凡二人共犯罪，而有一人在逃，见获者称逃者为首，更无证佐，则决其从罪。后获逃者，称前人为首，鞫问是实，还依首论，通计前罪，以充后数。○若犯罪事发而在逃者，众证明白，即同狱成，不须对问。</p>
