    <h1>匿父母夫丧</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>匿父母夫丧凡闻父母及夫之丧，匿不举哀者，杖六十，徒一年。若丧制未终，释服从吉，忘哀作乐及参预筵宴者，杖八十。</p><p>若闻期亲尊长丧，匿不举哀者，亦杖八十。若丧制未终，释服从吉者，杖六十。</p><p>○若兄姊之丧不丁忧者，杖一百，罢职役不叙。无丧诈称有丧，或旧丧诈称新丧者，罪同。有规避者，从重论。〇。若丧制未终，冒哀从仕者，杖八十。○其当该官司知而听行，各与同罪，不知者不坐。○其仕宦远方丁忧者，以闻丧月曰为始，夺情起复者，不拘此律。</p>
