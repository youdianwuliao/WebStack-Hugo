    <h1>殴大功以下尊长</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>殴大功以下尊长凡卑幼殴本宗及外姻缌麻兄姊，杖一百，小功杖六十，徒一年，大功杖七十，徒一年半；尊属又各加一等，折伤以上，各递加凡斗伤一等，笃疾者绞，死者斩。</p><p>○若尊长殴卑幼，非折伤，勿论，至折伤以上，缌麻减凡人一等，小功减二等，大功减三等，至死者绞。</p><p>其殴杀同堂弟妹、堂侄及侄孙者，杖一百，流三千里；故杀者秋绞。</p>
