    <h1>流四家属</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>流四家属凡犯流者，妻妾从之，父祖子孙欲随者，听迁徙安置人，家口亦准此。</p><p>若流徙人身死，家口虽经附籍，愿还乡者放还。其谋反逆叛及造畜蛊毒，若采生拆割人，杀一家三人，会赦犹流者，家口不在听还之律。</p>
