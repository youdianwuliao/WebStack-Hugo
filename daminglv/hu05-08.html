    <h1>荒芜田地</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>荒芜田地凡里长部内已入籍纳粮当差，田地无故荒芜，及应课种桑麻之类而不种者，俱以十分为率，一分笞二十，每二分加一等，罪止杖八十。县官各减二等。长官为首，佐职为从，人户亦计荒芜田地及不种桑麻之类，以五分为率，一分笞二十，每一分加三等，追征合纳税粮还官。</p>
