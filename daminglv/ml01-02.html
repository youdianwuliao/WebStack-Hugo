    <h1>军官有犯都司管卫卫管所申本管都督府</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>军官有犯都司管卫卫管所申本管都督府凡军官犯罪，从本管衙门开具事由，申呈五军都督府奏闻，请旨取问。若六部察院、按察司并分司及有司见问。</p><p>公事，但有千连军官及承告军官不公不法等事，须要密切实封奏闻，不许擅自勾问。</p><p>○若奉旨推问，除笞罪收赎，明白回奏，杖罪以上，须要论功定议，请旨区处。〇其管军衙门首领官有犯，不在此限。</p>
