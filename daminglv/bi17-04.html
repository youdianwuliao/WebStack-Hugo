    <h1>私役铺兵</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>私役铺兵凡各衙门一应公差人员，不许差使铺兵挑送官物及私己行李，违者笞四十。每名计一曰追雇工钱六十，丘入官。驿使稽程凡出使驰驿违限，常事一日笞二十，每三曰加二等，罪杖六十。军情重事加三等，因而失误机者斩。若各驿官故将好马藏匿，推故不即应付，以致违限者，对问明白，罪坐驿官。其遇水涨路道阻碍经行者，不坐○若驿使承受官司外书误，不依题写去处，错去他所而违限者，减二等。事干军务者，不减。若由公久题写错者，罪坐题写之人，驿使不坐。</p>
