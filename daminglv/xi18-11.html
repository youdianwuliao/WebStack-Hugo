    <h1>劫囚</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>劫囚凡劫囚者皆斩。若私窃放四人逃走者，与罪至死者减一等，窃而未得囚者，减二等，因而伤入者绞，杀人者斩，为从各灭一等。</p><p>○若官司差人追征钱粮、勾摄公事，及捕获罪人，聚众中途打夺者，杖一百。</p><p>流三千里。因而伤人者绞。</p><p>杀人及聚至十人，为首者斩，下手致命者绞，为从各减三等。</p><p>其率领家人随从打夺者，止。</p><p>坐尊长，若家人亦曾伤人者，仍以凡人首从论。</p>
