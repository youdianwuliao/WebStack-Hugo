    <h1>乘官畜产车船附私物</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>乘官畜产车船附私物凡因公差应乘官马、牛、驼、赢驴者，除随身衣仗外，私驮物不得过十斤，违者，五斤笞一十，每十斤加一等，罪止杖六；十斤笞一十，每二十斤加一等，罪止杖七十。家人随从者皆不坐。若受寄私载他人物者，寄物之人同罪，其物并入官。当该官司知而容纵者，与同罪，不知者不坐。若应合递运家小者，不在此限。</p>
