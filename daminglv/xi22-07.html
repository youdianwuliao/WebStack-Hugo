<p>见禁囚不得告举他事枷槷圈其寝食类凡被囚禁，不得告举他事。其为狱官、狱卒非理凌虐者，听告。若应四禁被问更首别事有干连之人，亦合准首，依法推问科罪。〇。</p><p>其年八十坏上，十岁以下及笃疾者，若妇人，除谋反逆叛、子孙不孝，或己身及同居之内，为人盗诈、侵夺财产及杀伤之类，听告，余并不得告。官司受而为理者，笞五十。</p>
