    <h1>纵军掳掠</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>纵军掳掠凡守边将帅，非奉调遣，私自使令军人于外境掳掠人财物者，杖一百，罢职充军；所部听使军官及总旗递减一等，并罪坐所由。小旗，军人不坐。○若军人不曾经由本管头目，私出外境掳掠者，为首杖一百，为从杖九十；伤人为首者斩，为从杖一百，俱发边远充军。若本管头目钤束不严，杖六十，附过还职。〇其边境城邑，有贼出没，乘机领兵攻取者，不在此限。可若于已附地面掳掠者，不分首从，皆斩。本管头目钤束不严，各杖八十，附过还职。〇。其知情故纵者，各与犯人同罪。</p>
