    <h1>娶亲属妻妾</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>娶亲属妻妾凡娶同宗无服之亲及无服亲之妻者，各杖一百。若娶缌麻亲之妻及舅甥妻，各杖六十，徒一年；小功以上，各以奸论。其出及改嫁而者，各杖八十。○若收父祖妾及伯叔毋者，各斩。若兄亡收嫂，弟亡收弟妇者，各绞。○妾各减二等。月。若娶同宗缌麻以上姑侄姊妹者，亦各以奸论，〇并离异。</p>
