    <h1>官员赴任过限</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>官员赴任过限凡已除官员，在京者以除授曰为始，在外者以领照会曰为始，各依已定程限赴任。若无故过限者，一曰笞一十，每十日加一等，罪止杖八十，并附过还职。</p><p>代官已到旧官，各照已定限期，交割户口、钱粮、刑名等项，及应有卷宗、籍册完备，无故十曰之外，不离任所者，依赴任过限论减二等。○其中途阻风、被盗、患病、丧事，不能前进者，听于所给凭，以备照勘。若有规避，唊官司符同保勘者，罪同。</p>
