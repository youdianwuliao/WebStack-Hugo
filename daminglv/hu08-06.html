    <div class="article-body">
<p>匿税凡客商匿税及卖酒醋之家，不纳课程者，笞五十。物货酒醋一半入官，于入官物内以十分为率，三分付告人充赏。务官攒拦自获者不赏，入门不吊引，同匿税法。其造酒醋自用者，不在此限。</p><p>○若买头匹不税契者，罪亦如之，仍于买主名下追征价钱一半入官。</p>
