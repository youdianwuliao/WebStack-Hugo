<p>承差转雇寄人凡承差起解官物、囚徒、畜产，不亲管送，而雇人、寄人代领送者，杖六十。因而损失官物、畜产及失囚者，依律各从重卖论，受寄、受雇人各减一等○其同差人自相替放者，各笞。有损失者，亦依损失官物及失囚律追断，不在减等之限。</p>
