    <h1>庸医杀伤人</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>庸医杀伤人凡庸医为人用药针刺，误不依本方，因而致死者，责令别医辨验药饵穴道，如无故害之情者，以过失杀人论，不许行医。○若故违本方，诈疗疾病而取财物者，计赃准窃盗论。
因而致死及因事故用乐杀人者。软窝弓杀伤人。
凡打捕户于深山旷野猛兽往来去处，穿作坑阱，及安置窝亏，不立望竿及抹眉小索者，笞四十。以致伤人者，减斗殴伤二等。因而致死者，杖一百，徒三年，追徵埋葬银一十两。</p>
