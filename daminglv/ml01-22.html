    <h1>共犯罪分首从</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>共犯罪分首从凡共犯罪者，以造意为首，随从者减一等。</p><p>人共犯八十以上及笃疾，归罪于共犯罪以次尊长侵损于人者，以凡若共犯罪，而首从本罪各别，各依本首，尊者从论坐。罪无首从，不言皆者，依首从法〇。</p><p>其犯擅入皇城宫殿等门，及私越度关，若避役在逃及犯奸者，亦无首从。</p>
