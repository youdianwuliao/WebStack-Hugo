    <h1>犯奸犯奸</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>犯奸犯奸凡和奸杖八十，有夫杖九十，杖一百○强奸者绞，未成者杖一百，流三千里。〇。</p><p>奸幼女十二岁以下者，虽和同强论，其和奸、刁奸者，男女同罪。奸生男女，责付奸夫收养，奸妇从夫嫁卖，其夫愿留者听。若嫁卖与奸夫者，奸夫、本夫各杖八十，妇人离异，归宗，财物入官。○强奸者，妇女不坐。○若媒合容止通奸者，犯人罪一等，私和奸事者减二等论。若奸妇有孕，罗耋妇罪坐本妇。</p>
