    <h1>从征守御官军逃</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>从征守御官军逃凡军官、军人从军征讨，私逃还家及逃往他所者，初犯杖一百，仍发出征；再犯者绞。知情窝藏者，充军。里长。</p><p>知而不首者，杖一百。若军还而先归者，减五等。因而在逃者，杖八十。若在京各卫军人在逃者，初犯杖九十，发附近卫分充军；各处守御城池军人在逃者，初犯杖八十，仍发本卫充军，杖一百俱发边远充军。三犯者情杖一百充军。里长知而不首者，各减二等。本管头目知情故纵者，各与同，杖一百，罢职充军。其在逃官军一百曰内能自出官首告者，免罪。</p>
