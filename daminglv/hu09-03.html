    <h1>得遗失物</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>得遗失物凡得遗失之物，限五曰内送官，官物还官，私物召人识认，于内一半给与得物人充赏，一半给还失物人如。</p><p>内无人识认者全给，限外不送官者，官物坐贼论，私物减二等，其物一半入官，一给主。</p><p>若于官私地内掘得埋藏之物者，并听收用。若有古器、钟鼎、符印异常之物，限三十曰内送官，违者杖八十，其物入官。</p>
