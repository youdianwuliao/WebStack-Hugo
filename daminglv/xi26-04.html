    <h1>嘱托公事</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>嘱托公事凡官吏诸色人等，但嘱即坐谟官吏听从者与同罪，不从者不坐。若事已施行者，杖一百。</p><p>所枉罪重者，官吏以故出入人罪论。若为他人及亲属嘱托者，减官吏罪三等，自嘱托已事者，加本罪一等。○若监临势要为人嘱托者，杖一百。所枉若受赃者，并计贼以枉法论。若官吏不避监临势要，将嘱托公事实迹赴上司首告。</p>
