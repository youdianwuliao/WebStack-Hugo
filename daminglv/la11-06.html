    <h1>禁止师巫邪术</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>禁止师巫邪术凡师巫假降邪神，书符咒水，扶鸾祷圣，自号端公、太保、师溥，及妄称弥勒佛、白莲社、明尊教、白云宗等会，一应左道乱正之术，或隐藏图像，烧香集众，夜聚晓散，佯修善事，扇。</p><p>惑人民，为首者绞，为从者各杖一百，流三千里。○若军民装扮神像，鸣锣击鼓，迎神赛会者，杖一百，罪坐为首之人。</p><p>○里长知而不首者，各笞四十。其民间春秋义社不在此。</p>
