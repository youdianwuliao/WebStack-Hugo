    <h1>那移出纳</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>那移出纳凡各衙门收支钱粮，正收正支，那移出纳，还盗论，不荷伙诃旧，罪止杖一百，流三千里，免刺。○若不给半印勘合，擅出权。</p><p>帖，或给勘合，不立文案放支，及仓库不候勘合，或已奉勘合，不附簿放支者，罪亦如之。</p><p>○其出征镇守军马经过去处，行粮草料，明立效案，即时应付，具数开申合干上司，杖六十。</p>
