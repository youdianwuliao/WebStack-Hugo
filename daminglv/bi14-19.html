    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>夜禁凡京城夜禁，一更三点，钟声已静，五更三点钟声未动，犯者笞三十；二更、三更、四更犯者，笞五十。外郡城镇各减一等。其公务急速，疾病、生产、死丧，不在禁限。〇。其暮钟未静，晓钟已动，巡夜人等，故将行人拘留，诬执犯夜者抵罪。</p><p>若犯夜拒捕及打夺者，杖一百。因而殴人至浙伤以上者，秋绞，死者斩。</p>
