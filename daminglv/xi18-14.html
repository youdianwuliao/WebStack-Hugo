    <h1>亲属相盗</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>亲属相盗凡各相盗财物者，期亲减凡人五等，大功减四等，小功减三等，缌麻减二等，无服之亲减二等，并免刺。</p><p>若行强盗者，尊长犯，卑幼亦犯尊长，以凡人论。若有杀伤，诸，各依杀伤尊长、卑幼本律从重论○若同居卑幼将引他人盗己家财物者，卑幼依私檀用财物论，如二等，罪止杖一百。他人减凡盗罪一等，免离。若有杀伤者，自依杀伤尊长、卑幼本律科罪。他人纵不知情，亦依强盗论。若他人杀，依杀伤尊长、卑幼本律从重论。其同居奴婢、雇工人盗家长财物及自相盗者，减凡盗罪一等，免刺。</p>
