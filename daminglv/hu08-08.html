    <h1>人户亏兑课程</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>人户亏兑课程凡民间调岁额办茶税诸色课程，年终不纳齐足者，计不足之数，以十分为率，一分笞四十，每一分加一等，罪止杖八十，追课纳官。盐场、茶局及税务、河泊所等官，不行用心办课，年终比附上年课额亏兑，以十分论，一分笞五十，每一分加一等，罪止杖一百。所亏课程，着落追补还官。○若有隐瞒侵欺借用者，并计贼以监守自盗论。</p>
