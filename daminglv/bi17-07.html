    <h1>丈书应给驿而不给</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>丈书应给驿而不给凡朝廷调遣军马，及报警急军务，至边将，若边将及各衙门飞报军情，诣朝廷文书，故不遣使给驿者，杖一百。因而失误赈救饥荒、申报灾异，取索军需之类重事，故不遣使给驿者，杖八十。若常事不应给驿而故给驿者，笞四十。</p>
