    <h1>冒度关津</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>冒度关津凡无久引私度关津者，杖八十。若关不由门，津不由渡，而谓耸桀路迂，越度者，杖九十。若越度缘边关塞者，杖一百，徒三年。因而出外境者绞。守把之人知而故纵者同罪。失于盘诘者，各减三等，罪止杖一百，军兵又减一等，并罪坐直曰者。○若有文引冒名度关津者，杖八十。家人相冒者，罪坐家长，守把之人，知情与同罪，不知者不坐。○其将马赢私度，冒度关津者，杖六十。越度杖七。</p>
