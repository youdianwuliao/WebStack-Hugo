    <h1>居丧嫁娶</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>居丧嫁娶凡居父母及夫丧，而身自嫁娶者，杖一百。若男子居丧娶妾妻女者，夏蓄庞如之，追夺并离异。知而共为婚姻者，各减五等。不知者不嫁娶者，杖八十，妾不坐。</p><p>○若居父母舅姑及夫丧，而与应嫁娶人主婚者，杖八十。○其夫丧服满，愿守志，非女之祖父母、父母而强嫁之者，杖八十。期亲强嫁者减二等。妇人不坐，追归前夫之家。听从守志，娶者亦不坐，追还财礼。</p>
