    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>守支钱粮及擅开官封凡仓库官攒、斗级、库子役满得代，所收钱粮官物，并令守支尽绝，若无短少，方许给由。其有应合相沿交害之物，听提调官吏监临盘点见数，不得指廒指库交害。违者各杖一百。○若官物有印封记，其主典不请元封官司而擅开者，杖六十。</p>
