    <h1>诈称内使等官</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>诈称内使等官凡诈称内使及都督府、四辅、谏院等官，六部监察御史、按察司官，在外体察事务，欺诳官府，扇惑人民者软知情，随行者减一等。其当该官司知而听行，与同罪，不知者不坐。</p><p>○若诈称使臣乘驿者，杖一百，流三千里，为从者减一等。驿官知而应付者，与同罪。不知情，失盘诘者，笞五十。其有符验而应付者，不坐。</p>
