<p>私受公侯财物凡内外各卫指挥、千户、百户、镇抚并总旗、小旗等，不得于私下或明接受公、侯所与宝钞、金银、段疋、衣服、粮米、钱物。若受者，军官杖一百，罢职发边远充军，总旗、小旗罪同，再犯处死。公、侯与者，初犯、再犯，犯准免死一次。若奉命征讨，与者，受者不在此限。</p>
