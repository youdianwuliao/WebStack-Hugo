    <h1>妻妾殴故夫父母</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>妻妾殴故夫父母凡妻妾夫亡改嫁，殴故夫之祖父毋父母者，拉与殴舅姑罪同。其旧舅姑欧已故子孙改嫁妻妾者，亦与殴子孙妇同。○若奴娜殴旧家长及家长殴旧奴妞者，各以凡人论。父祖被殴，凡祖父母、父母为人所殴，子孙即时救护而还殴，非折伤勿论，至折伤以上，减凡斗三等，至死者，依常律。</p><p>若祖父母、父母为人所杀，而子孙檀杀行凶人者，杖六十。其即时。</p><p>杀死者勿论</p>
