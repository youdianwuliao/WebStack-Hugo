    <h1>私卖军器</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>私卖军器凡军人关给衣甲、𬬰刀、旗帜、一应军器，私下货卖者，杖一百，发边远充军；军官卖者，罪同罢职充军；买者笞四十。应禁者以私有论罪。军器价钱并入官。军官、军人买者勿论。毁弃军器凡将帅关拨一应军器，征守事讫，停留不回纳还官者，十曰杖六十，每十日加二等，罪止杖一百○若辄弃毁者，一件杖八十，每一件加一等，三十件以上斩。</p><p>遗失及误毁者，各减三等，军人各又减一等，并验数追陪。其曾经战阵而有损失者，不坐不陪。</p>
