    <h1>乘舆服御物</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>乘舆服御物凡乘舆服御物收藏修整不如法者，杖六十；进御差失者，笞四十。其车马之属不调习，驾驭之具不坚完者，杖八十。○若主守之人将乘舆服御物私自借用，或转借与人及借之者，各杖一百，徒三年。若弃毁者，罪亦如之。遗失及误毁者，各减三等。○若御幸舟船误不坚固者，工匠杖一百。若不整顿修饰，及在船缺少者，杖六十，并罪坐所由。监临、提调官，各减工丘罪二等，并临时奏闻区处。</p>
