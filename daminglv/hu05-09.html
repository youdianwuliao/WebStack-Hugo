    <h1>弃毁器物稼穑等</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>弃毁器物稼穑等凡弃毁人器物及毁伐树木、稼穑者，计赃准窃盗论，免官物加二等。若遗失及误毁官物者，各减三等，并验数追偿。私物者，偿而不毁茔内兽者，杖八十；毁人神主者，杖九十。若毁损人房屋、墙垣之类者，计合用修造雇工钱坐贼论，各令修立官屋加二等。误毁者，但令修立，不坐罪。</p>
