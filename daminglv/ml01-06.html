    <h1>军官军人犯罪免徒流</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>军官军人犯罪免徒流凡军官、军人犯罪，律该徒、流者，各决杖一百，徒五等，皆发二千里内卫分充军；流三等，照依地里远近，发各卫充军；该发边远充军者，依律发遣，并免刺字〇。若军丁、军吏及校尉犯罪，俱准军人拟断，亦免徒、流刺字。吏谓犯罪得累减。</p><p>凡一人犯罪应减者，若为从减减、故失减、公罪递减之类，并得累减。</p>
