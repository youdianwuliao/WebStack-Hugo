    <h1>保辜限期</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>保辜限期凡保辜者，责苓犯人医治，辜限内皆须因伤死者，以斗殴杀久论。其在辜限外，及虽在辜限内，伤已平复，官司文案明白，别因他故死者，各从本殴伤法。若本折伤以上，辜内医治平复者，各减三等。辜内虽平复，而成残废笃疾，及辜限满曰不平复者，各依律全科。○手足及以他物殴伤人者，限二十日。○以刃及汤火伤人者，限三十日。○折跌肢体及破骨堕胎者，无问手足他物，皆限五十日。</p>
