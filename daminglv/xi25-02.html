    <h1>纵容妻妾犯奸</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>纵容妻妾犯奸凡纵容妻妾与人通奸，本夫、奸夫、奸妇各杖九十。抑勒妻妾及乞养女与人通奸者，本夫、义父各杖一百，奸夫杖八十，妇𭀚不坐，并离异归宗。○若纵容抑勒亲女及子孙之妇妾与人通奸者，罪亦如之。○若用财买休、卖休、和娶人妻者，本夫、本妇及买休人各杖一百，妇人离异归宗，财礼入官。若买休人与妇人用计逼勒本夫，𫹎弃其夫，别无卖休之情，诸不坐。买休人及妇人各杖六十，徒一年，妇人余罪收赎，给付本夫，从其嫁卖。妾减三等，媒合人各减犯人罪一等。</p>
