    <h1>若盗贼捕限</h1>
    <div class="meta">大明律 · 集思阁</div>
    <div class="article-body">
<p>若盗贼捕限凡捕强、窃盗贼，以事发曰为始，当该应捕弓兵一月不获。强盗者笞二十，两月笞三十，三月笞四十。捕盗官罚俸铣两月，弓兵一月。不获。窃盗者笞一十，两月笞二十，三月笞三十。捕盗俸钱一，限内获贼及半者免罪。上。若经隔二十曰以上告同。</p>
