<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面未找到 - 万卷楼</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e4edf5 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      max-width: 420px;
      width: 100%;
    }
    .star {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: #4a90d9;
    }
    .code { font-size: 3rem; font-weight: 700; color: #2d3748; line-height: 1; }
    .msg { font-size: 1rem; color: #718096; margin: 12px 0 28px; }
    .btn {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1e3a5f, #2d5a87);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.25s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(30, 58, 95, 0.3); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="star" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
    <div class="code">404</div>
    <div class="msg">页面走丢了，星辰大海还在这里等你</div>
    <a href="./index.html" class="btn">返回万卷楼</a>
  </div>
</body>
</html>
